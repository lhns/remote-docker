# Docker Swarm deployment.
#
#   ssh <node> "mkdir -p /var/lib/remote-docker/{state,authorized_keys.d}"
#   docker stack deploy -c swarm.yml workspace
#
# Make those directories first: a missing bind source becomes an empty
# root-owned one rather than an error.
#
# Set WORKSPACE_DATA for where state lives on the node, WORKSPACE_IMAGE for
# which image to run.

# Required: `docker stack deploy` still reads the file with the legacy loader.
version: "3.8"

services:
  workspace:
    image: ${WORKSPACE_IMAGE:-ghcr.io/lhns/remote-docker-workspace:latest}
    command: ["elevate"]

    environment:
      # Swarm expands this, so the privileged child finds the task exactly.
      WORKSPACE_SELF: "{{.Task.Name}}"

      TZ: ${TZ:-UTC}
      DOCKER_TLS_CERTDIR: ""

      # Empty means overlay2. On Ceph- or NFS-backed WORKSPACE_DATA set
      # --storage-driver=fuse-overlayfs; overlay2 refuses those filesystems.
      WORKSPACE_DOCKERD_ARGS: ${WORKSPACE_DOCKERD_ARGS:-}

    volumes:
      # Not mounted at /var/run/docker.sock: dind runs its own daemon there.
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/host-docker.sock

      # Per slot: two replicas sharing a graph directory corrupt it.
      - type: bind
        source: ${WORKSPACE_DATA:-/var/lib/remote-docker}/{{.Task.Slot}}/docker
        target: /var/lib/docker

      # Shared across slots. Host keys and the uid map: lose these and clients
      # report REMOTE HOST IDENTIFICATION HAS CHANGED and tunnel ports move.
      - type: bind
        source: ${WORKSPACE_DATA:-/var/lib/remote-docker}/state
        target: /etc/workspace

      # Drop one <name>.pub per user in here.
      - type: bind
        source: ${WORKSPACE_DATA:-/var/lib/remote-docker}/authorized_keys.d
        target: /etc/workspace/authorized_keys.d
        read_only: true

    ports:
      # The mesh delivers into the task's namespace, which the privileged child
      # joins (ADR 0013). Add `mode: host` to keep the client's own address.
      - "2222:2222"

    # More than one node? Pin it: the binds above are directories on one node,
    # and a task rescheduled elsewhere finds none of them.
    #
    #   docker node update --label-add workspace=true <node>
    #
    # deploy:
    #   placement:
    #     constraints:
    #       - node.labels.workspace == true

    healthcheck:
      # Checks the privileged child, whose namespace this task shares.
      test: ["CMD", "remote-dockerd", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
