# Docker Swarm deployment.
#
#   ssh <node> "mkdir -p /var/lib/remote-docker/{state,authorized_keys.d}"
#   docker stack deploy -c swarm.yml workspace
#
# Make those directories first, or they arrive empty and root-owned. The binds
# below are one node's filesystem.
#
# WORKSPACE_DATA is where state lives, WORKSPACE_IMAGE is which image to run.

# Required: `docker stack deploy` still reads the file with the legacy loader.
version: "3.8"

services:
  workspace:
    image: ${WORKSPACE_IMAGE:-ghcr.io/lhns/remote-docker-workspace:latest}
    command: ["elevate"]

    environment:
      # Swarm expands this, so the privileged child finds the task exactly.
      WORKSPACE_SELF: "{{.Task.Name}}"

      TZ: ${TZ:-UTC}
      DOCKER_TLS_CERTDIR: ""

      # Empty means overlay2. On Ceph- or NFS-backed WORKSPACE_DATA set
      # --storage-driver=fuse-overlayfs; overlay2 refuses those filesystems.
      WORKSPACE_DOCKERD_ARGS: ${WORKSPACE_DOCKERD_ARGS:-}

    volumes:
      # Not mounted at /var/run/docker.sock: dind runs its own daemon there.
      - /var/run/docker.sock:/var/run/host-docker.sock
      # Per slot: two replicas sharing a graph directory corrupt it.
      - ${WORKSPACE_DATA:-/var/lib/remote-docker}/{{.Task.Slot}}/docker:/var/lib/docker
      # Host keys and the uid map, shared across slots. Lose these and clients
      # report REMOTE HOST IDENTIFICATION HAS CHANGED and tunnel ports move.
      - ${WORKSPACE_DATA:-/var/lib/remote-docker}/state:/etc/workspace
      # Drop one <name>.pub per user in here.
      - ${WORKSPACE_DATA:-/var/lib/remote-docker}/authorized_keys.d:/etc/workspace/authorized_keys.d:ro

    ports:
      - "2222:2222"  # ssh
      # - "2280:2280"  # ssh over a websocket, for a reverse proxy (ADR 0034)

    healthcheck:
      # Checks the privileged child, whose namespace this task shares.
      test: ["CMD", "remote-dockerd", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
