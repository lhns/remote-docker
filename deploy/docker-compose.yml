# Plain Docker / Compose deployment (single host, no Swarm).
#
#   mkdir -p authorized_keys.d state
#   cp ~/alice.pub authorized_keys.d/alice.pub     # filename == unix account
#   docker compose up -d --build
#
# One file per account, one key per line, re-read within a minute. Emptying a
# file revokes that account and keeps its home.
#
services:
  workspace:
    # Context is the repository root: the image builds the agent from source.
    build:
      context: ..
      dockerfile: image/Dockerfile
    image: ${WORKSPACE_IMAGE:-remote-docker-workspace:latest}
    container_name: remote-docker-workspace
    restart: unless-stopped

    # dind runs its own dockerd, its own bridge and iptables, and mounts NFS.
    privileged: true

    ports:
      - "2222:2222"  # ssh
      # - "2280:2280"  # ssh over a websocket, for a reverse proxy (ADR 0034)

    environment:
      TZ: ${TZ:-UTC}
      DOCKER_TLS_CERTDIR: ""
      # Empty means overlay2. Use --storage-driver=fuse-overlayfs only if you
      # replace the volume below with Ceph- or NFS-backed storage.
      WORKSPACE_DOCKERD_ARGS: ${WORKSPACE_DOCKERD_ARGS:-}
      # Which image a per-account daemon runs (ADR 0019). The agent cannot find
      # this out for itself -- it would mean inspecting its own container
      # through the host's Docker socket, which this deployment deliberately
      # does not have -- so the same value that names the service image is
      # passed in. Without it the fallback is stock docker:dind, which carries
      # neither fuse-overlayfs nor anything else this workspace decided it
      # needs, and a daemon inheriting --storage-driver=fuse-overlayfs then
      # crash-loops naming a binary rather than the cause.
      WORKSPACE_IMAGE: ${WORKSPACE_IMAGE:-remote-docker-workspace:latest}

    volumes:
      - workspace-docker:/var/lib/docker
      # Host keys and the uid map: lose these and clients report REMOTE HOST
      # IDENTIFICATION HAS CHANGED and tunnel ports move.
      - ./state:/etc/workspace
      # Drop one <name>.pub per user in here.
      - ./authorized_keys.d:/etc/workspace/authorized_keys.d:ro

    healthcheck:
      # Asks the agent, which asks the daemon for its version.
      test: ["CMD", "remote-dockerd", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  workspace-docker:
