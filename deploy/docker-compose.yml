# Plain Docker / Compose deployment (single host, no Swarm).
#
#   mkdir -p authorized_keys.d state
#   cp ~/alice.pub authorized_keys.d/alice.pub     # filename == unix account
#   docker compose up -d --build
#
services:
  workspace:
    # Context is the repository root: the image builds the agent from source.
    build:
      context: ..
      dockerfile: image/Dockerfile
    image: ${WORKSPACE_IMAGE:-remote-docker-workspace:latest}
    container_name: remote-docker-workspace
    restart: unless-stopped

    # dind needs this: it runs its own dockerd, sets up its own bridge and
    # iptables rules, and mounts NFS inside its own mount namespace.
    privileged: true

    ports:
      - "2222:2222"

    environment:
      TZ: ${TZ:-UTC}
      DOCKER_TLS_CERTDIR: ""
      # Empty means overlay2, which is right for the named volume below. Set
      # it to --storage-driver=fuse-overlayfs only if you replace that volume
      # with a bind onto Ceph- or NFS-backed storage, where overlay2 refuses
      # to run at all.
      WORKSPACE_DOCKERD_ARGS: ${WORKSPACE_DOCKERD_ARGS:-}

    volumes:
      # Keep the graph driver on real local disk if you possibly can.
      - workspace-docker:/var/lib/docker
      # Host keys + uid map. Persisting this is what stops clients getting a
      # "REMOTE HOST IDENTIFICATION HAS CHANGED" warning after a redeploy,
      # and what keeps each user's uid (and therefore port) stable.
      - ./state:/etc/workspace
      # Drop one <name>.pub per user in here.
      - ./authorized_keys.d:/etc/workspace/authorized_keys.d:ro

    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 2222 && docker info >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  workspace-docker:
