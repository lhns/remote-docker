# Docker Swarm deployment.
#
# Swarm cannot run privileged tasks, so swarm-launcher starts the real
# container through the host's docker.sock on the placed node. The launched
# container joins the launcher task's network namespace
# (LAUNCH_NETWORK_MODE: container:{{.Task.Name}}), which is what lets the
# Swarm service publish port 2222 on its behalf and puts it on the overlay
# network where Traefik can reach it.
#
# Note that this skips the dind-bridge network entirely -- the launched
# container has no network of its own.
#
services:
  workspace-launcher:
    image: ${DOCKER_PROXY:-}registry.gitlab.com/egos-tech/swarm-launcher:1.0.0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
    networks:
      - internal
    hostname: "workspace-launcher-{{.Task.Slot}}"

    environment:
      LAUNCH_IMAGE: ${WORKSPACE_IMAGE:-ghcr.io/lhns/docker-ssh-workspace:latest}
      LAUNCH_PULL: 'true'
      LAUNCH_PROJECT_NAME: 'docker-ssh-workspace'
      LAUNCH_SERVICE_NAME: 'docker-ssh-workspace'
      LAUNCH_PRIVILEGED: 'true'
      LAUNCH_NETWORK_MODE: container:{{.Task.Name}}

      LAUNCH_ENVIRONMENTS: >-
        TZ=Europe/Berlin
        DOCKER_TLS_CERTDIR=
        WORKSPACE_DOCKERD_ARGS=--storage-driver=fuse-overlayfs

      # /var/lib/docker on Ceph/NFS-backed appdata is why the storage driver
      # above is set: overlay2 refuses, vfs works but copies every layer.
      # fuse-overlayfs is already installed in the image, so the entrypoint
      # override hack is not needed here -- just pass the flag.
      LAUNCH_VOLUMES: >-
        /mnt/appdata/docker/workspace/{{.Task.Slot}}/docker:/var/lib/docker
        /mnt/appdata/docker/workspace/state:/etc/workspace
        /mnt/appdata/docker/workspace/authorized_keys.d:/etc/workspace/authorized_keys.d:ro

    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.workspace == true
      restart_policy:
        condition: any
        delay: 10s

    ports:
      # mode: host so the SSH port lands on the node that actually runs it,
      # rather than being round-robined by the routing mesh to nodes where
      # the launched container does not exist.
      - target: 2222
        published: 2222
        protocol: tcp
        mode: host

networks:
  internal:
    external: true
