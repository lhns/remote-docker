version: 2

project_name: remote-docker

before:
  hooks:
    - go mod tidy

builds:
  - id: remote-docker
    main: ./cmd/remote-docker
    binary: remote-docker
    # The premise of the project is a machine that cannot have software
    # installed, so every target must be a single self-contained binary.
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos: [windows, linux, darwin]
    goarch: [amd64, arm64]

archives:
  - id: remote-docker
    ids: [remote-docker]
    # A zip on Windows and a tarball elsewhere, matching what each platform's
    # tooling expects to be handed.
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - NOTICE

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
