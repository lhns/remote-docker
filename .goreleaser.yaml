version: 2

project_name: remote-docker

before:
  hooks:
    # Per module: the client is where the binary comes from, and a tidy at
    # the repository root would only touch the shared module (ADR 0021).
    - go mod tidy
    - sh -c "cd client && go mod tidy"

builds:
  - id: remote-docker
    main: ./cmd/remote-docker
    dir: client
    binary: remote-docker
    # The premise of the project is a machine that cannot have software
    # installed, so every target must be a single self-contained binary.
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos: [windows, linux, darwin]
    goarch: [amd64, arm64]

archives:
  - id: remote-docker
    ids: [remote-docker]
    # A zip on Windows and a tarball elsewhere, matching what each platform's
    # tooling expects to be handed.
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - NOTICE

checksum:
  name_template: checksums.txt

snapshot:
  # Matches the tag the workspace image gets from the same commit, so a client
  # binary and an image can be paired by eye. `remote-docker version` on a CI
  # artifact prints sha-abc1234; on a release it prints the release version.
  version_template: "sha-{{ .ShortCommit }}"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
