version: 2

project_name: remote-docker

before:
  hooks:
    # Per module: the client is where the binary comes from, and a tidy at
    # the repository root would only touch the shared module (ADR 0021).
    - sh -c "cd core && go mod tidy"
    - sh -c "cd client && go mod tidy"
    # Every module linked into a released binary, with its licence text. A
    # hook rather than a committed file: it is derived from go.sum, and a
    # committed copy would go stale the first time a dependency moved.
    - bash scripts/third-party-notices.sh

# The embedded Compose reports this as `docker compose version`. Upstream sets
# it by ldflag at its own release, so without it every build says "dev".
#
# Read out of the module graph by the workflow rather than written down here,
# because a version in two places is a version that drifts the first time
# dependabot moves one of them. Defaulted so a build outside CI still works.
env:
  - COMPOSE_VERSION={{ if index .Env "COMPOSE_VERSION" }}{{ .Env.COMPOSE_VERSION }}{{ else }}dev{{ end }}

builds:
  - id: remote-docker
    main: ./cmd/remote-docker
    dir: client
    binary: remote-docker
    # The premise of the project is a machine that cannot have software
    # installed, so every target must be a single self-contained binary.
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags: &ldflags
      - -s -w -X main.version={{.Version}} -X github.com/docker/compose/v5/internal.Version={{ .Env.COMPOSE_VERSION }}
    goos: [windows, linux, darwin]
    goarch: [amd64, arm64]

  # Android is its own GOOS, and has to be.
  #
  # The Linux build will not run there, in two ways that have to be fixed
  # together, so fixing either one alone just reaches the next message:
  #
  #   has unexpected e_type: 2
  #     Android has required position-independent executables since Android 5.
  #     Go's default is ET_EXEC, which is the 2.
  #   executable's TLS segment is underaligned:
  #   alignment is 8, needs to be at least 64 for ARM64 Bionic
  #     what a linux/arm64 PIE gets instead. Go emits PT_TLS with align 8, and
  #     bionic requires 64.
  #
  # And -buildmode=pie on Linux is not a fix even ignoring that, because it
  # makes the binary DYNAMIC: it gains PT_INTERP /lib/ld-linux-aarch64.so.1 and
  # so requires glibc, which is a regression everywhere the current static
  # binary works today, Alpine first among them.
  #
  # GOOS=android answers all of it. It is ET_DYN, it emits no PT_TLS at all, and
  # its interpreter is /system/bin/linker64, which is the one the device has.
  # No -buildmode needed: that is already the default there.
  #
  #   test/elf.sh android <binary>   is the check; the three facts to read off
  #   a binary are its ELF type, its PT_TLS alignment and its PT_INTERP.
  #
  # BUILT WITH CGO, which the other targets are not. Android has no
  # /etc/resolv.conf, so Go's pure resolver finds no configuration and falls
  # back to 127.0.0.1:53, where nothing is listening: every hostname fails to
  # resolve. DNS on Android belongs to netd, and bionic's getaddrinfo is the
  # only way to it, so the binary has to link against libc. See ADR 0023.
  #
  # The compiler is the NDK's, which ubuntu runners ship at ANDROID_NDK_HOME.
  # An unset variable fails the build here rather than producing a binary that
  # cannot look anything up. API 24 is Termux's own floor, Android 7.
  #
  # Both architectures, now that the NDK is a build dependency either way.
  # x86_64 is emulators and Chromebooks.
  #
  # Loadable is all this claims. Nothing has been run on Android.
  - id: remote-docker-android
    main: ./cmd/remote-docker
    dir: client
    binary: remote-docker
    env:
      - CGO_ENABLED=1
      # Spelled out per architecture rather than built from a template
      # variable: goreleaser expands $name as an environment variable before
      # the template runs, so `{{ $ndk := ... }}` arrives as `{{ := ... }}`.
      - >-
        {{- if eq .Arch "arm64" }}CC={{ .Env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang{{- end }}
        {{- if eq .Arch "amd64" }}CC={{ .Env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang{{- end }}
    flags:
      - -trimpath
    ldflags: *ldflags
    goos: [android]
    goarch: [arm64, amd64]

  # The agent, for a workspace that is a VM rather than a container.
  #
  # The image builds this from source and always has; what was missing is a way
  # to get it onto a machine that is not running the image. See ADR 0025.
  #
  # Its own module, which is why this is a separate block with `dir: agent`
  # rather than another target of the client's -- and why it is cheap: 24 lines
  # of go.sum against the client's 786 (ADR 0021).
  #
  # Linux only. The agent drives useradd, netns and inotify; there is nowhere
  # else for it to run and a cross-compile would only prove it links.
  - id: remote-dockerd
    main: ./cmd/remote-dockerd
    dir: agent
    binary: remote-dockerd
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos: [linux]
    goarch: [amd64, arm64]

archives:
  - id: remote-docker
    ids: [remote-docker, remote-docker-android]
    # A zip on Windows and a tarball elsewhere, matching what each platform's
    # tooling expects to be handed.
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - CHANGELOG.md
      - LICENSE
      - NOTICE
      - THIRD-PARTY-NOTICES.md

  # Its own archive, so `remote-docker_<v>_linux_amd64` stays the client and an
  # operator downloading a workspace does not get 70MB of Docker CLI with it.
  - id: remote-dockerd
    ids: [remote-dockerd]
    name_template: >-
      remote-dockerd_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    files:
      - CHANGELOG.md
      - LICENSE
      - NOTICE
      - THIRD-PARTY-NOTICES.md
      # Flattened, so the install lines in the README and in the unit's own
      # header work on what comes out of the tarball.
      - src: deploy/remote-dockerd.service
        strip_parent: true
      - src: deploy/remote-dockerd.env.example
        strip_parent: true

# One SPDX document per archive, beside it on the release page. The image and
# the chart have had one since they were published; the archives are what most
# people actually download, and had none.
#
# syft is the default tool and the release workflow installs it pinned. A
# snapshot build makes no archives, so nothing here runs in ci.yml.
sboms:
  - id: archives
    artifacts: archive

checksum:
  name_template: checksums.txt

snapshot:
  # Matches the tag the workspace image gets from the same commit, so a client
  # binary and an image can be paired by eye. `remote-docker version` on a CI
  # artifact prints sha-abc1234; on a release it prints the release version.
  version_template: "sha-{{ .ShortCommit }}"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
