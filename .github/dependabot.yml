# Dependency updates, opened as PRs rather than applied, so the integration
# suite runs both daemon modes end to end before a bump is taken.
version: 2
updates:
  # One entry per module (ADR 0021). Dependabot does not discover nested
  # modules, so a module missing here silently stops being updated, and
  # nothing reports it. The client is where the weight is: 861 lines of
  # go.sum against the agent's 28 and the shared module's none at all
  # (2026-09-06; re-check with `wc -l */go.sum`).
  - package-ecosystem: gomod
    directory: /client
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # cli, buildx and buildkit pin each other, so one PR tests a
      # combination as a combination.
      docker:
        patterns:
          - "github.com/docker/*"
          - "github.com/moby/*"
          - "github.com/containerd/*"
      golang-x:
        patterns:
          - "golang.org/x/*"

  - package-ecosystem: gomod
    directory: /agent
    schedule:
      interval: weekly

  # The two core modules: the mechanisms with no Docker in them (ADR 0021).
  # core-client carries the NFS server and the watchers, so it is the one of
  # the two with third-party weight.
  - package-ecosystem: gomod
    directory: /core-client
    schedule:
      interval: weekly
    groups:
      golang-x:
        patterns:
          - "golang.org/x/*"

  - package-ecosystem: gomod
    directory: /core-agent
    schedule:
      interval: weekly

  # The shared module: the contract, the tunnel and the log handler. It has no
  # third-party dependency at all, which is the property worth keeping.
  - package-ecosystem: gomod
    directory: /core
    schedule:
      interval: weekly

  # The cache engine, whose go.mod has no require at all: that is what makes
  # it a module rather than a package, so a PR adding one is refused.
  - package-ecosystem: gomod
    directory: /dircache
    schedule:
      interval: weekly

  # The integration suites' instruments. Not linked into anything and not
  # shipped; it carries x/sys because it reads raw inotify.
  - package-ecosystem: gomod
    directory: /test/probes
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Stated because the default is five, which silently withholds a bump
    # while five action PRs sit open: upload-artifact reached v7 while
    # download-artifact stayed on v4.
    open-pull-requests-limit: 10

  # The composite action pins setup-go itself, and the root entry does not
  # look inside .github/actions.
  - package-ecosystem: github-actions
    directory: /.github/actions/setup-go
    schedule:
      interval: weekly

  # The workspace image's base. A new docker:dind is a new dockerd for every
  # workspace, and the integration suite builds this image from source.
  - package-ecosystem: docker
    directory: /image
    schedule:
      interval: weekly
