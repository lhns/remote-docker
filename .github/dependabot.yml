# Dependency updates, opened as PRs rather than applied, so the integration
# suite runs both daemon modes end to end before a bump is taken.
version: 2
updates:
  # One entry per module (ADR 0021). Dependabot does not discover nested
  # modules, so a module missing here silently stops being updated, and
  # nothing reports it. The client is where the weight is: 861 lines of
  # go.sum against the agent's 28 and the shared module's none at all
  # (2026-09-06; re-check with `wc -l */go.sum`).
  # One entry for all eight Go modules (ADR 0021), not one each: a dependency
  # several modules require has to move in ALL of them, and dependabot bumping
  # one at a time broke the build four times (#159, #161, #170, #180). go.work
  # hides it locally, so it fails only where CI and image/Dockerfile build a
  # module alone. `group-by: dependency-name` puts every directory needing a
  # dependency in one PR.
  #
  # Dependabot does not discover nested modules, so a directory missing here
  # silently stops being updated.
  - package-ecosystem: gomod
    directories:
      - /core
      - /dircache
      - /machine
      - /core-agent
      - /core-client
      - /agent
      - /client
      - /test/probes
    schedule:
      interval: weekly
    # The default is five, which withholds bumps silently once five are open.
    open-pull-requests-limit: 15
    groups:
      # cli, buildx and buildkit pin each other, so they move together: no
      # `group-by`, which would split them into a PR each.
      docker:
        patterns:
          - "github.com/docker/*"
          - "github.com/moby/*"
          - "github.com/containerd/*"
      shared:
        group-by: dependency-name
        patterns:
          - "*"
        exclude-patterns:
          - "github.com/docker/*"
          - "github.com/moby/*"
          - "github.com/containerd/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Stated because the default is five, which silently withholds a bump
    # while five action PRs sit open: upload-artifact reached v7 while
    # download-artifact stayed on v4.
    open-pull-requests-limit: 10

  # The composite action pins setup-go itself, and the root entry does not
  # look inside .github/actions.
  - package-ecosystem: github-actions
    directory: /.github/actions/setup-go
    schedule:
      interval: weekly

  # The workspace image's base. A new docker:dind is a new dockerd for every
  # workspace, and the integration suite builds this image from source.
  - package-ecosystem: docker
    directory: /image
    schedule:
      interval: weekly
