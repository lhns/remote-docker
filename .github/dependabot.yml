# Dependency updates, opened as PRs rather than applied.
#
# The integration suite is what makes these safe to take: a bump to docker/cli,
# buildx or moby carries real behaviour, and this repository has been bitten
# more than once by a claim about a dependency that was not true when checked
# (docker:dind shipping fuse-overlayfs; buildx being reachable without
# vendoring it). A PR runs both modes end to end before anybody believes it.
version: 2
updates:
  # Five modules, five entries (ADR 0021, ADR 0031). Dependabot does not
  # discover nested modules, so a directory missing here is a module whose
  # dependencies silently stop being updated -- which is the failure this file
  # exists to prevent, and which it failed to prevent once: core-client and
  # core-agent existed in the repository for two commits before they were added
  # here, and nothing said so.
  #
  # The client is where the weight is: 857 lines of go.sum against the agent's
  # 24 and the shared module's 10.
  - package-ecosystem: gomod
    directory: /client
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # The docker stack moves together and breaks together: cli, buildx and
      # buildkit pin each other, which is the whole reason compose cannot be
      # embedded today. One PR so a combination is tested as a combination.
      docker:
        patterns:
          - "github.com/docker/*"
          - "github.com/moby/*"
          - "github.com/containerd/*"
      golang-x:
        patterns:
          - "golang.org/x/*"

  - package-ecosystem: gomod
    directory: /agent
    schedule:
      interval: weekly

  # The two core modules: the mechanisms with no Docker in them (ADR 0031).
  # core-client carries the NFS server and the watchers, so of the two it is the
  # one with real third-party weight.
  - package-ecosystem: gomod
    directory: /core-client
    schedule:
      interval: weekly
    groups:
      golang-x:
        patterns:
          - "golang.org/x/*"

  - package-ecosystem: gomod
    directory: /core-agent
    schedule:
      interval: weekly

  # The shared module: the contract, the tunnel and the log handler. It depends
  # on almost nothing, which is the property worth keeping -- a PR here that
  # adds weight is worth reading closely.
  - package-ecosystem: gomod
    directory: /core
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Stated, because the default is FIVE and that is not a rounding error: it
    # silently withheld the download-artifact bump while five action PRs sat
    # open, so upload-artifact went to v7 while download stayed on v4.
    open-pull-requests-limit: 10

  # The workspace image's base. A new docker:dind is a new dockerd for every
  # workspace, and the integration suite builds this image from source.
  - package-ecosystem: docker
    directory: /image
    schedule:
      interval: weekly
