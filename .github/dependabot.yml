# Dependency updates, opened as PRs rather than applied, so the integration
# suite runs both daemon modes end to end before a bump is taken.
version: 2
updates:
  # One entry for all eight Go modules (ADR 0021), not one each: a dependency
  # several modules require has to move in ALL of them, and bumping one at a
  # time broke the image build four times (#159, #161, #170, #180).
  # `group-by: dependency-name` puts every directory needing a dependency in
  # one PR. Dependabot does not discover nested modules, so a directory
  # missing here silently stops being updated.
  - package-ecosystem: gomod
    directories:
      - /core
      - /dircache
      - /machine
      - /core-agent
      - /core-client
      - /agent
      - /client
      - /test/probes
    schedule:
      interval: weekly
    # The default is five, which withholds bumps silently once five are open.
    open-pull-requests-limit: 15
    groups:
      # cli, buildx and buildkit pin each other, so they move together: no
      # `group-by`, which would split them into a PR each.
      docker:
        patterns:
          - "github.com/docker/*"
          - "github.com/moby/*"
          - "github.com/containerd/*"
      shared:
        group-by: dependency-name
        patterns:
          - "*"
        exclude-patterns:
          - "github.com/docker/*"
          - "github.com/moby/*"
          - "github.com/containerd/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Stated because the default is five, which silently withholds a bump
    # while five action PRs sit open: upload-artifact reached v7 while
    # download-artifact stayed on v4.
    open-pull-requests-limit: 10

  # The composite actions pin setup-go and setup-dotnet themselves, and the
  # root entry does not look inside .github/actions.
  - package-ecosystem: github-actions
    directories:
      - /.github/actions/setup-go
      - /.github/actions/setup-wix
    schedule:
      interval: weekly

  # The workspace image's base. A new docker:dind is a new dockerd for every
  # workspace, and the integration suite builds this image from source.
  - package-ecosystem: docker
    directory: /image
    schedule:
      interval: weekly
