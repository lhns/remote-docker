name: integration

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:

permissions:
  contents: read

# Never cancelled by a newer run, and each commit is its own group: a later
# push must not destroy an earlier commit's answer (why: ci.yml).
concurrency:
  group: integration-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # Decides whether this change needs the suites at all.
  #
  # These are expensive -- a real workspace, a real NFS mount, two modes, most
  # of ten minutes -- so they were gated on an `integration` label. That label
  # DID NOT EXIST, so the gate never opened: every pull request this repository
  # has ever had skipped the suites entirely, silently, reporting green.
  #
  # It cost something real. Dependabot opened the Go base-image bump an hour
  # before a dependency raised go.mod past it and broke the image build; the PR
  # sat unmerged because a dependency PR that nothing meaningful has run
  # against looks exactly like one that has. The suites are worth most on
  # precisely the changes nobody wants to read closely.
  #
  # So: paths decide, and the label remains as the manual override for a change
  # that touches none of them but deserves the run anyway. Fails OPEN -- if the
  # diff cannot be read, run them. Wasting a runner is cheaper than the last
  # two days.
  gate:
    name: do the suites apply
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: decide
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'integration') }}
        run: |
          set -u
          say() { echo "run=$1" >>"$GITHUB_OUTPUT"; echo "$2"; }

          if [ "${{ github.event_name }}" != pull_request ]; then
            say true "not a pull request: the suites always run."
            exit 0
          fi
          if [ "$LABELLED" = true ]; then
            say true "labelled 'integration': running on request."
            exit 0
          fi

          # The paths that have ever broken these suites: the image, the
          # contract they exercise, the suites themselves, and the module
          # versions everything is built from.
          if ! changed=$(git diff --name-only "$BASE" "$HEAD" 2>&1); then
            say true "could not read the diff ($changed): running to be safe."
            exit 0
          fi
          echo "changed files:"; echo "$changed" | sed 's/^/  /'

          if echo "$changed" | grep -Eq '^(image/|test/|agent/|core/|core-agent/|core-client/|client/|dircache/|go\.work$|\.github/workflows/integration\.yml$)'; then
            say true "touches code, the image or the suites."
          else
            say false "documentation or unrelated config only: skipping the suites."
          fi

  # Settles one question, and it is the one most likely to stop the whole
  # integration suite: can a privileged container on a GitHub runner mount NFS?
  #
  # The runner's kernel is shared with every container on it, so NFS client
  # support is not something the image can supply -- if the kernel lacks it,
  # no amount of apt-get inside the container helps, and the suite needs a
  # different home. Answering it here, cheaply, before the suite exists.
  nfs-capability:
    name: nfs client in a privileged container
    runs-on: ubuntu-latest
    # Every suite below hangs off this job, so gating it gates all of them.
    needs: gate
    if: needs.gate.outputs.run == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: does the runner kernel know about nfs at all
        run: |
          set -x
          grep -c nfs /proc/filesystems || true
          sudo modprobe nfs && echo "modprobe nfs: ok"
          grep nfs /proc/filesystems

      - name: export a directory from the runner
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y nfs-kernel-server
          sudo mkdir -p /srv/probe
          echo "hello from the runner" | sudo tee /srv/probe/marker
          echo '/srv/probe 127.0.0.1(ro,sync,no_subtree_check,insecure)' \
            | sudo tee /etc/exports
          sudo exportfs -ra
          sudo systemctl restart nfs-kernel-server
          sudo exportfs -v

      # host networking so the container reaches the runner's own loopback,
      # which is where the real client's reverse tunnel will listen too.
      - name: mount it from inside a privileged container
        run: |
          set -eux
          docker run --rm --privileged --network host \
            docker:28-dind sh -eux -c '
              apk add --no-cache nfs-utils
              mkdir -p /mnt/probe
              mount -t nfs 127.0.0.1:/srv/probe /mnt/probe \
                -o nfsvers=3,tcp,nolock,soft,timeo=30
              cat /mnt/probe/marker
              umount /mnt/probe
            '

      - name: verdict
        run: echo "NFS client works inside a privileged container on this runner."

  # Can a cache be a union mount? Every question the cache mode (ADR 0044) asks
  # of the KERNEL rather than of our code, answered in about three minutes with
  # no binary of ours but the watch probe.
  #
  # Beside nfs-capability rather than inside it because it settles a different
  # thing, and it is here rather than in a branch's own workflow because the
  # answers expire: they are about the runner's kernel, and that moves.
  union-capability:
    name: can a cache be a union mount
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.run == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go

      - name: load the nfs and fuse modules
        run: sudo modprobe nfs && sudo modprobe fuse

      - name: probe
        run: bash test/union-probe.sh

  # The suites, one job each, all on the same runner recipe. The names are
  # what the checks are known by and stay as they were; the matrix is only
  # what runs and how long it may take.
  #
  #   integration     the whole thing together: a real workspace container,
  #                   the real client binary, a real kernel NFS mount.
  #   vm              the agent on the runner itself, with no container around
  #                   it (ADR 0025). The only suite that needs an NFS client
  #                   and fuse-overlayfs on the runner: everywhere else the
  #                   mount happens inside a container that carries its own.
  #   per-user-dind   a daemon per account (ADR 0019), with two accounts. Its
  #                   own suite because the two modes need differently
  #                   configured workspaces, and integration.sh passing
  #                   UNCHANGED is the evidence the shared mode still works.
  #   two-clients     one account from TWO machines at once (ADR 0029): two
  #                   state directories, two keys, sessions held at the same
  #                   time rather than one after the other.
  #   nfs-resilience  what a mount does when the session drops. It reports
  #                   what it measured whether it passes or fails, because the
  #                   point is the numbers and a green tick hides them.
  #   fs-conformance  the same filesystem probe against a native bind mount
  #                   and against a share, and every difference listed with a
  #                   reason in test/fs-conformance/deviations-linux.txt. The
  #                   transcripts and the report are uploaded whatever the
  #                   verdict, because the report is what fills that file.
  suite:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: nfs-capability
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: integration
            name: end to end
            container: remote-docker-itest
            timeout: 30
          - suite: vm
            name: the agent on a machine
            timeout: 30
          - suite: per-user-dind
            name: a daemon per account
            container: remote-docker-peruser
            timeout: 40
          - suite: two-clients
            name: two machines, one account
            container: remote-docker-twoclients
            timeout: 40
          - suite: nfs-resilience
            name: what a mount does when the session drops
            container: remote-docker-nfsres
            timeout: 40
          - suite: fs-conformance
            name: does a share behave like a bind mount
            container: remote-docker-fsconf
            timeout: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go

      - name: load the nfs and fuse modules
        run: sudo modprobe nfs && sudo modprobe fuse

      - name: install an NFS client and fuse-overlayfs on the runner
        if: matrix.suite == 'vm'
        run: sudo apt-get update && sudo apt-get install -y nfs-common fuse-overlayfs

      - name: run the suite
        run: bash test/${{ matrix.suite }}.sh

      # The path fs-conformance.sh copies to. It sits outside the suite's work
      # directory, which the suite removes on exit.
      - name: keep the transcripts and the report
        if: always() && matrix.suite == 'fs-conformance'
        uses: actions/upload-artifact@v7
        with:
          name: fs-conformance-linux
          path: /tmp/fs-conformance-artifacts
          if-no-files-found: warn

      # vm.sh runs the agent on the runner and has no container to ask.
      - name: workspace logs on failure
        if: failure() && matrix.container
        run: docker logs ${{ matrix.container }} 2>&1 | tail -100 || true
