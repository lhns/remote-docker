name: integration

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:

permissions:
  contents: read

# Never cancelled by a newer run, and each commit is its own group: a later
# push must not destroy an earlier commit's answer (why: ci.yml).
concurrency:
  group: integration-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # Two questions, and no suite starts until both have passed.
  #
  # Does this change need the suites? PATHS decide, and the `integration` label
  # is the manual override for a change that touches none of them. It was the
  # label ALONE, and that label did not exist, so the gate never opened: every
  # pull request this repository had skipped the suites silently and reported
  # green. Fails OPEN, because a wasted runner is cheaper than that.
  #
  # Can a privileged container on this runner mount NFS? The runner's kernel is
  # shared with every container on it, so no apt-get inside the image can
  # supply NFS client support: without it the suites need a different home.
  # Folded in here rather than a job of its own for 26s of work (why a runner
  # slot is worth that: ci.yml, the lint job).
  gate:
    name: do the suites apply, and can this runner mount nfs
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: decide
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'integration') }}
        run: |
          set -u
          say() { echo "run=$1" >>"$GITHUB_OUTPUT"; echo "$2"; }

          if [ "${{ github.event_name }}" != pull_request ]; then
            say true "not a pull request: the suites always run."
            exit 0
          fi
          if [ "$LABELLED" = true ]; then
            say true "labelled 'integration': running on request."
            exit 0
          fi

          # The paths that have ever broken these suites: the image, the
          # contract they exercise, the suites themselves, and the module
          # versions everything is built from.
          if ! changed=$(git diff --name-only "$BASE" "$HEAD" 2>&1); then
            say true "could not read the diff ($changed): running to be safe."
            exit 0
          fi
          echo "changed files:"; echo "$changed" | sed 's/^/  /'

          if echo "$changed" | grep -Eq '^(image/|test/|agent/|core/|core-agent/|core-client/|client/|dircache/|machine/|go\.work$|\.github/workflows/integration\.yml$)'; then
            say true "touches code, the image or the suites."
          else
            say false "documentation or unrelated config only: skipping the suites."
          fi

      - name: does the runner kernel know about nfs at all
        if: steps.decide.outputs.run == 'true'
        run: |
          set -x
          grep -c nfs /proc/filesystems || true
          sudo modprobe nfs && echo "modprobe nfs: ok"
          grep nfs /proc/filesystems

      - name: export a directory from the runner
        if: steps.decide.outputs.run == 'true'
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y nfs-kernel-server
          sudo mkdir -p /srv/probe
          echo "hello from the runner" | sudo tee /srv/probe/marker
          echo '/srv/probe 127.0.0.1(ro,sync,no_subtree_check,insecure)' \
            | sudo tee /etc/exports
          sudo exportfs -ra
          sudo systemctl restart nfs-kernel-server
          sudo exportfs -v

      # host networking so the container reaches the runner's own loopback,
      # which is where the real client's reverse tunnel will listen too.
      - name: mount it from inside a privileged container
        if: steps.decide.outputs.run == 'true'
        run: |
          set -eux
          docker run --rm --privileged --network host \
            docker:28-dind sh -eux -c '
              apk add --no-cache nfs-utils
              mkdir -p /mnt/probe
              mount -t nfs 127.0.0.1:/srv/probe /mnt/probe \
                -o nfsvers=3,tcp,nolock,soft,timeo=30
              cat /mnt/probe/marker
              umount /mnt/probe
            '

      - name: verdict
        if: steps.decide.outputs.run == 'true'
        run: echo "NFS client works inside a privileged container on this runner."

  # Can a cache be a union mount? Every question the cache mode (ADR 0044) asks
  # of the KERNEL rather than of our code, with no binary of ours but the watch
  # probe. A job of its own rather than another tail on gate: at about three
  # minutes it is the one capability probe the suites should not wait behind,
  # and it settles nothing they depend on. It runs on every pull request
  # because its answers are about the runner's kernel, and that moves.
  union-capability:
    name: can a cache be a union mount
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.run == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go

      - name: load the nfs and fuse modules
        run: sudo modprobe nfs && sudo modprobe fuse

      - name: probe
        run: bash test/union-probe.sh

  # The suites, one job each, all on the same runner recipe. The names are what
  # the checks are known by and stay as they were; each suite's own header says
  # what it proves. What is not in those headers:
  #
  #   vm              the only suite needing an NFS client and fuse-overlayfs
  #                   on the RUNNER, since it has no container to carry them.
  #   old-workspace   the only suite that does not build both ends; it needs
  #                   network access to ghcr.io.
  suite:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.run == 'true'
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: integration
            name: end to end
            container: remote-docker-itest
            timeout: 30
          - suite: vm
            name: the agent on a machine
            timeout: 30
          - suite: per-user-dind
            name: a daemon per account
            container: remote-docker-peruser
            timeout: 40
          - suite: two-clients
            name: two machines, one account
            container: remote-docker-twoclients
            timeout: 40
          - suite: nfs-resilience
            name: what a mount does when the session drops
            container: remote-docker-nfsres
            timeout: 40
          - suite: fs-conformance
            name: does a share behave like a bind mount
            container: remote-docker-fsconf
            timeout: 30
          - suite: old-workspace
            name: this client against a published older workspace
            container: remote-docker-oldworkspace
            timeout: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go

      - name: load the nfs and fuse modules
        run: sudo modprobe nfs && sudo modprobe fuse

      - name: install an NFS client and fuse-overlayfs on the runner
        if: matrix.suite == 'vm'
        run: sudo apt-get update && sudo apt-get install -y nfs-common fuse-overlayfs

      - name: run the suite
        run: bash test/${{ matrix.suite }}.sh

      # The path fs-conformance.sh copies to. It sits outside the suite's work
      # directory, which the suite removes on exit.
      - name: keep the transcripts and the report
        if: always() && matrix.suite == 'fs-conformance'
        uses: actions/upload-artifact@v7
        with:
          name: fs-conformance-linux
          path: /tmp/fs-conformance-artifacts
          if-no-files-found: warn

      # vm.sh runs the agent on the runner and has no container to ask.
      - name: workspace logs on failure
        if: failure() && matrix.container
        run: docker logs ${{ matrix.container }} 2>&1 | tail -100 || true
