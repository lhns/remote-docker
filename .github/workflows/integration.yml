name: integration

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether this change needs the suites at all.
  #
  # These are expensive -- a real workspace, a real NFS mount, two modes, most
  # of ten minutes -- so they were gated on an `integration` label. That label
  # DID NOT EXIST, so the gate never opened: every pull request this repository
  # has ever had skipped the suites entirely, silently, reporting green.
  #
  # It cost something real. Dependabot opened the Go base-image bump an hour
  # before a dependency raised go.mod past it and broke the image build; the PR
  # sat unmerged because a dependency PR that nothing meaningful has run
  # against looks exactly like one that has. The suites are worth most on
  # precisely the changes nobody wants to read closely.
  #
  # So: paths decide, and the label remains as the manual override for a change
  # that touches none of them but deserves the run anyway. Fails OPEN -- if the
  # diff cannot be read, run them. Wasting a runner is cheaper than the last
  # two days.
  gate:
    name: do the suites apply
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: decide
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'integration') }}
        run: |
          set -u
          say() { echo "run=$1" >>"$GITHUB_OUTPUT"; echo "$2"; }

          if [ "${{ github.event_name }}" != pull_request ]; then
            say true "not a pull request: the suites always run."
            exit 0
          fi
          if [ "$LABELLED" = true ]; then
            say true "labelled 'integration': running on request."
            exit 0
          fi

          # The paths that have ever broken these suites: the image, the
          # contract they exercise, the suites themselves, and the module
          # versions everything is built from.
          if ! changed=$(git diff --name-only "$BASE" "$HEAD" 2>&1); then
            say true "could not read the diff ($changed): running to be safe."
            exit 0
          fi
          echo "changed files:"; echo "$changed" | sed 's/^/  /'

          if echo "$changed" | grep -Eq '^(image/|test/|cmd/|internal/|pkg/|go\.(mod|sum)$|\.github/workflows/integration\.yml$)'; then
            say true "touches code, the image or the suites."
          else
            say false "documentation or unrelated config only: skipping the suites."
          fi

  # Settles one question, and it is the one most likely to stop the whole
  # integration suite: can a privileged container on a GitHub runner mount NFS?
  #
  # The runner's kernel is shared with every container on it, so NFS client
  # support is not something the image can supply -- if the kernel lacks it,
  # no amount of apt-get inside the container helps, and the suite needs a
  # different home. Answering it here, cheaply, before the suite exists.
  nfs-capability:
    name: nfs client in a privileged container
    runs-on: ubuntu-latest
    # The two suites below hang off this job, so gating it gates all three.
    needs: gate
    if: needs.gate.outputs.run == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: does the runner kernel know about nfs at all
        run: |
          set -x
          grep -c nfs /proc/filesystems || true
          sudo modprobe nfs && echo "modprobe nfs: ok"
          grep nfs /proc/filesystems

      - name: export a directory from the runner
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y nfs-kernel-server
          sudo mkdir -p /srv/probe
          echo "hello from the runner" | sudo tee /srv/probe/marker
          echo '/srv/probe 127.0.0.1(ro,sync,no_subtree_check,insecure)' \
            | sudo tee /etc/exports
          sudo exportfs -ra
          sudo systemctl restart nfs-kernel-server
          sudo exportfs -v

      # host networking so the container reaches the runner's own loopback,
      # which is where the real client's reverse tunnel will listen too.
      - name: mount it from inside a privileged container
        run: |
          set -eux
          docker run --rm --privileged --network host \
            docker:28-dind sh -eux -c '
              apk add --no-cache nfs-utils
              mkdir -p /mnt/probe
              mount -t nfs 127.0.0.1:/srv/probe /mnt/probe \
                -o nfsvers=3,tcp,nolock,soft,timeo=30
              cat /mnt/probe/marker
              umount /mnt/probe
            '

      - name: verdict
        run: echo "NFS client works inside a privileged container on this runner."

  # The whole thing, together: a real workspace container, the real client
  # binary, and a real kernel NFS mount inside the dind daemon.
  end-to-end:
    name: end to end
    runs-on: ubuntu-latest
    needs: nfs-capability
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: load the nfs client module
        run: sudo modprobe nfs

      - name: run the suite
        run: bash test/integration.sh

      - name: workspace logs on failure
        if: failure()
        run: docker logs remote-docker-itest 2>&1 | tail -100 || true

  # A daemon per account (ADR 0019), with two accounts, which is the only way
  # to test the claim at all.
  #
  # A separate job rather than more of the suite above: the two modes need
  # differently configured workspaces, and integration.sh passing UNCHANGED is
  # itself the evidence that the shared mode still works. One script with a
  # flag would only ever prove whichever branch it took.
  per-user-dind:
    name: a daemon per account
    runs-on: ubuntu-latest
    needs: nfs-capability
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: load the nfs client module
        run: sudo modprobe nfs

      - name: run the suite
        run: bash test/per-user-dind.sh

      - name: workspace logs on failure
        if: failure()
        run: docker logs remote-docker-peruser 2>&1 | tail -100 || true
