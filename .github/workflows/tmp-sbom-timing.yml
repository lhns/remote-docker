name: tmp sbom timing
on:
  push:
    branches: [syft-1.55-single-sbom-config]
jobs:
  time:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-go
      - name: compose version
        run: echo "COMPOSE_VERSION=$(cd client && go list -m -f '{{.Version}}' github.com/docker/compose/v5)" >> "$GITHUB_ENV"
      - uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v1.55.0
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.19.0
          args: release --snapshot --clean
      - name: scan every archive, serially
        env:
          SYFT_FILE_METADATA_CATALOGER_ENABLED: "true"
        run: |
          syft version | head -3
          mkdir -p sbom
          total_start=$(date +%s.%N)
          for a in dist/*.tar.gz dist/*.zip; do
            s=$(date +%s.%N)
            syft "$a" --output "spdx-json=sbom/$(basename "$a").sbom.json" --enrich all
            e=$(date +%s.%N)
            echo "SCAN $(basename "$a") $(echo "$e - $s" | bc)s"
          done
          total_end=$(date +%s.%N)
          echo "SERIAL TOTAL $(echo "$total_end - $total_start" | bc)s"
      - uses: actions/upload-artifact@v7
        with:
          name: sboms
          path: sbom/*.json
