name: msi

# The Windows installer, built and installed. Path-triggered: the .wxs decides
# everything under test, and the binary is a payload. The cost (ADR 0048): a tag
# can publish an MSI this has not seen.
on:
  pull_request:
    paths:
      - "installer/windows/**"
      - "test/msi.ps1"
      - ".github/workflows/msi.yml"
      - ".github/actions/setup-wix/**"
      - "machine/broker_standin_windows.go"
      - "client/cmd/remote-docker/machine_service.go"
  push:
    branches: [main]
    paths:
      - "installer/windows/**"
      - "test/msi.ps1"
      - ".github/workflows/msi.yml"
      - ".github/actions/setup-wix/**"
      - "machine/broker_standin_windows.go"
      - "client/cmd/remote-docker/machine_service.go"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: msi-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # Cross-compiled on ubuntu, where the module cache is warm, as release.yml does.
  binaries:
    name: cross-compile the payload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go

      # Not goreleaser: this needs two Windows binaries and nothing else it does.
      - name: build the client for windows
        run: |
          set -eux
          cd client
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=windows GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w" \
              -o "../windows/${arch}/remote-docker.exe" ./cmd/remote-docker
          done

      # The installer's Hyper-V workspace is tested against a stand-in for
      # Hyper-V, which only the rdstandin build tag compiles in. Built here
      # beside the release-shaped binaries, and the two kinds are told apart
      # below: a release binary must not carry it.
      - name: build the stand-in client for windows
        run: |
          set -eux
          cd client
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -tags rdstandin -ldflags "-s -w" \
            -o ../windows/standin-amd64/remote-docker.exe ./cmd/remote-docker

      - name: only the stand-in contains the stand-in
        run: |
          set -eu
          marker=REMOTE-DOCKER-STANDIN-HYPERV
          for f in windows/amd64/remote-docker.exe windows/arm64/remote-docker.exe; do
            info="$(go version -m "$f")"
            case "$info" in *rdstandin*) echo "$f was built with rdstandin"; echo "$info"; exit 1;; esac
            if grep -q "$marker" "$f"; then echo "$f contains $marker"; exit 1; fi
          done
          info="$(go version -m windows/standin-amd64/remote-docker.exe)"
          case "$info" in *rdstandin*) ;; *) echo "the stand-in binary lacks the rdstandin tag"; echo "$info"; exit 1;; esac
          grep -q "$marker" windows/standin-amd64/remote-docker.exe || { echo "the stand-in binary lacks $marker"; exit 1; }
          echo "release binaries are clean; the stand-in is marked"

      - uses: actions/upload-artifact@v7
        with:
          name: windows-binaries
          path: windows/**/remote-docker.exe
          if-no-files-found: error
          retention-days: 1

  installer:
    name: build it and install it
    needs: [binaries]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: windows-binaries
          path: windows
      - uses: ./.github/actions/setup-wix

      # Both architectures are built; only amd64 can be installed (no Windows
      # arm64 runner). The version is a three-number stand-in, above any
      # release so that the upgrade from the latest released MSI is not a
      # downgrade.
      - name: build the msis
        shell: pwsh
        run: |
          foreach ($pair in @(@('amd64', 'x64'), @('arm64', 'arm64'))) {
            ./installer/windows/build.ps1 -Version 99.0.0 -Arch $pair[1] `
              -Binary "windows/$($pair[0])/remote-docker.exe" `
              -Out "dist/msi/remote-docker_99.0.0_windows_$($pair[0]).msi"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      # The same package with the stand-in client, at two versions, for the
      # Hyper-V workspace and the upgrade between them.
      - name: build the stand-in msis
        shell: pwsh
        run: |
          foreach ($v in '0.0.1', '0.0.2') {
            ./installer/windows/build.ps1 -Version $v -Arch x64 `
              -Binary windows/standin-amd64/remote-docker.exe -Out "dist/msi/standin_$v.msi"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: a snapshot version is refused rather than truncated
        shell: pwsh
        run: |
          $out = (./installer/windows/build.ps1 -Version 0.0.0-dev.9370b24 -Arch x64 `
            -Binary windows/amd64/remote-docker.exe -Out dist/msi/should-not-exist.msi *>&1 | Out-String)
          $out
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'build.ps1 accepted a snapshot version; it must refuse one'
            exit 1
          }
          # Refused for THIS reason, not for any failure at all.
          if ($out -notmatch 'not an MSI version') {
            Write-Host 'build.ps1 failed, but not by refusing the version'
            exit 1
          }
          Write-Host 'refused, as it must be'
          # GitHub's pwsh wrapper exits with $LASTEXITCODE, which is the 1 we
          # just asked for and would fail the step.
          exit 0

      # About 4 minutes when it passes. Bounded so a hang fails while the step
      # below can still print the logs, instead of running to GitHub's 6 hours.
      - name: install, uninstall, the docker.exe feature and the Hyper-V workspace
        timeout-minutes: 30
        shell: pwsh
        env:
          # For gh, which downloads the latest released MSI for the upgrade test.
          GH_TOKEN: ${{ github.token }}
        run: ./test/msi.ps1 -Msi dist/msi/remote-docker_99.0.0_windows_amd64.msi -StandinMsi dist/msi/standin_0.0.1.msi -StandinNextMsi dist/msi/standin_0.0.2.msi

      # For a job that died outside the suite, which prints its own.
      - name: the msiexec logs
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path "$env:TEMP\msi-logs") {
            Get-ChildItem "$env:TEMP\msi-logs" | ForEach-Object {
              Write-Host "== $($_.Name)"; Get-Content $_.FullName
            }
          }
          Write-Host "== still running"
          Get-CimInstance Win32_Process -Filter "Name='msiexec.exe' OR Name='remote-docker.exe'" |
            ForEach-Object { Write-Host "$($_.ProcessId) $($_.CommandLine)" }
          if (Test-Path "$env:ProgramData\remote-docker-standin") {
            Get-ChildItem "$env:ProgramData\remote-docker-standin" -File | ForEach-Object {
              Write-Host "== $($_.Name)"; Get-Content $_.FullName
            }
          }
