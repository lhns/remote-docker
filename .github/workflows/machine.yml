name: machine

# The WSL backend, end to end, on a Windows runner.
#
# This exists because of a measurement rather than a hope: a spike established
# that a GitHub Windows runner runs real WSL2 and can import a rootfs
# (ADR 0026). Without that, the whole backend would ship having never run.
#
# It cannot be one job. A Windows runner runs Windows containers, so the Linux
# image cannot be built there; a Linux runner builds it and hands the rootfs
# over as an artifact. That split is the reason for the shape below and not an
# accident of taste.
#
# Hyper-V gets no job at all. The runners do not offer it, and
# docs/testing-machines.md is the whole of its verification.
#
# Every pull request, not only those touching the backend: the Windows client
# is the one in CI, so every PR meets it.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A container image IS a rootfs, which is the whole reason the backend is
  # short: what gets installed into the machine is the artifact CI already
  # builds and tests on every push, and no package manager runs anywhere.
  rootfs:
    name: export the workspace image as a rootfs and record the probe oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go

      - name: build the workspace image
        run: docker build -t rd-workspace:ci -f image/Dockerfile .

      - name: export its filesystem
        run: |
          set -eux
          id=$(docker create rd-workspace:ci)
          # Gzipped, because that is what a release publishes and what somebody
          # downloads. `wsl --import` reads it directly, and this is where that
          # is proven rather than assumed.
          docker export "$id" | gzip -9 > rootfs.tar.gz
          docker rm "$id"
          ls -lh rootfs.tar.gz

      # The filesystem conformance probe and its oracle. The probe is one
      # static Linux binary that walks a directory through every operation a
      # build tool uses and prints what happened; run against the runner's own
      # disk it is the oracle, and the wsl job runs the same image against a
      # share backed by an NTFS directory and diffs the two transcripts.
      #
      # build_probe from test/lib.sh, so the recipe for a probe binary lives in
      # one place and this cannot drift from what test/fs-conformance.sh runs.
      - name: build the probe image and run the oracle
        run: |
          set -eux
          REPO=$PWD
          . test/lib.sh
          build_probe fsprobe "$PWD/fsprobe"
          mkdir -p ctx
          cp test/fs-conformance/Dockerfile fsprobe ctx/
          docker build -t fsprobe:ci ctx
          mkdir -p native
          docker run --rm -v "$PWD/native:/w" fsprobe:ci /w > transcript-native.txt
          wc -l transcript-native.txt
          docker save fsprobe:ci | gzip > fsprobe.tar.gz
          ls -lh fsprobe.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: workspace-rootfs
          path: rootfs.tar.gz
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v7
        with:
          name: fsprobe-image
          path: fsprobe.tar.gz
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v7
        with:
          name: transcript-native
          path: transcript-native.txt
          if-no-files-found: error
          retention-days: 1

  wsl:
    name: a machine on wsl
    runs-on: windows-latest
    needs: rootfs
    # Fifty, not thirty: creating a machine, importing the rootfs, an idle
    # disconnect with its three-minute wait and the conformance probe's five
    # thousand files over the share do not fit in thirty.
    timeout-minutes: 50
    # State of its own, for every step that runs the client: nothing here
    # depends on or disturbs whatever the runner image already has.
    env:
      REMOTE_DOCKER_STATE_DIR: ${{ runner.temp }}\rd-state
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go

      - uses: actions/download-artifact@v8
        with:
          name: workspace-rootfs

      - name: install wsl
        run: wsl --install --no-distribution

      - name: build the client
        run: go build -o rd.exe ./cmd/remote-docker
        working-directory: client

      - name: create the machine
        shell: pwsh
        run: |
          .\client\rd.exe remote machine create ci --rootfs .\rootfs.tar.gz
          .\client\rd.exe remote ls
          .\client\rd.exe remote machine status ci

      # The one that matters: the session, the SSH transport, the NFS export,
      # the bind rewriting and the daemon inside the machine, in one command.
      - name: docker run, with a bind mount from this machine
        shell: pwsh
        run: |
          "from the runner" | Out-File -Encoding ascii marker
          # Joined before matching. PowerShell's -match on an ARRAY is a filter
          # rather than a test: it returns the lines that matched, so -notmatch
          # on multi-line output returns the other lines and is truthy whether
          # or not the thing being looked for is there. It failed a step whose
          # command had printed exactly what the step demanded.
          $out = (.\client\rd.exe run --rm -v "${PWD}:/w" alpine:3 cat /w/marker) -join "`n"
          $out
          if ($out -notmatch 'from the runner') { throw "the bind mount did not resolve" }

      - name: GNU tar sets attributes on files it wrote, and a non-root uid can mkdir
        shell: pwsh
        # The one Windows client in CI. GNU tar sets attributes on the
        # descriptor it just wrote, which the kernel cannot retry after ESTALE;
        # both defects that broke it showed only from a Windows client.
        run: |
          $probe = 'apk add -q tar >/dev/null 2>&1 && cd /w && mkdir -p src && echo x >src/a && tar -cf t.tar src && rm -r src && tar -xf t.tar && chmod 600 src/a && echo TAR-OK'
          $out = (.\client\rd.exe run --rm -v "${PWD}:/w" alpine:3 sh -c $probe) -join "`n"
          $out
          if ($out -notmatch 'TAR-OK') { throw "GNU tar could not set attributes on a share" }
          $out = (.\client\rd.exe run --rm --user 1000 -v "${PWD}:/w" alpine:3 sh -c 'mkdir /w/made && echo MKDIR-OK') -join "`n"
          $out
          if ($out -notmatch 'MKDIR-OK') { throw "a non-root uid could not mkdir on a share" }

      - name: creating it again changes nothing
        shell: pwsh
        run: |
          $out = (.\client\rd.exe remote machine create ci --rootfs .\rootfs.tar.gz) -join "`n"
          $out
          if ($out -notmatch 'nothing to do') { throw "create was not idempotent" }

      # The machine is a machine: it stops, starts, and what was inside it is
      # still inside it. A rebuild is the only thing that discards, and a stop
      # that quietly did the same would be found by nobody until it had.
      - name: it survives being stopped and started
        shell: pwsh
        run: |
          .\client\rd.exe run -d --name survivor alpine:3 sleep 600
          .\client\rd.exe remote machine stop ci
          .\client\rd.exe remote machine start ci

          # What is holding the endpoint, if anything, and what the client says
          # about itself. An EOF on the local pipe names the wrong layer
          # entirely, so this asks the two questions that separate "no session
          # at all" from "a session whose machine went away underneath it".
          .\client\rd.exe remote status
          Get-Process rd -ErrorAction SilentlyContinue | Format-Table Id, StartTime

          # The session's own log. `remote status` answering while a docker
          # request gets EOF means the failure is inside the session rather
          # than in reaching it, and this is the only place that says why.
          Get-Content "$env:REMOTE_DOCKER_STATE_DIR\logs\*.log" -Tail 40 -ErrorAction SilentlyContinue

          $out = (.\client\rd.exe ps -a --filter name=survivor --format '{{.Names}}') -join "`n"
          $out
          if ($out -notmatch 'survivor') { throw "the container did not survive a restart" }
          .\client\rd.exe rm -f survivor

      # Left alone, and then used again.
      #
      # A session that has been idle DISCONNECTS on purpose (ADR 0015), which
      # releases the machine and lets WSL shut it down. All of that is correct,
      # and the machine being stopped here is not the failure -- the failure is
      # the command after it. This found one: the machine was started again and
      # dialled immediately, before its agent was listening, so the first
      # command failed and the second worked, which reads as flakiness rather
      # than as the deterministic bug it was.
      - name: a machine comes back after sitting idle
        shell: pwsh
        timeout-minutes: 8
        run: |
          # A background session, which is the thing holding the machine. A
          # one-shot `docker run` would take its hold with it when it exits and
          # prove nothing about a machine left alone.
          .\client\rd.exe remote start
          Start-Sleep -Seconds 180

          $state = (wsl -l -v | Out-String)
          $state
          $out = (.\client\rd.exe run --rm -v "${PWD}:/w" alpine:3 cat /w/marker) -join "`n"
          $out
          if ($out -notmatch 'from the runner') { throw "an idle machine did not come back" }
          .\client\rd.exe remote stop

      # The same probe the Linux leg runs (test/fs-conformance.sh), against a
      # share whose other end is an NTFS directory. The transcript is compared
      # with the oracle recorded on the ubuntu runner, and a difference the
      # deviations file does not name fails the job.
      - uses: actions/download-artifact@v8
        with:
          name: fsprobe-image

      - uses: actions/download-artifact@v8
        with:
          name: transcript-native

      - name: load the probe image into the machine's daemon
        shell: pwsh
        run: |
          $out = (.\client\rd.exe load -i fsprobe.tar.gz) -join "`n"
          $out
          if ($out -notmatch 'fsprobe') { throw "the probe image was not loaded" }

      - name: run the probe against a share backed by NTFS
        shell: pwsh
        # Out-File with an explicit encoding, because `>` in Windows PowerShell
        # writes UTF-16. The runner's pwsh is 7, whose utf8 carries no BOM;
        # 5.1's does, and the diff step strips one either way.
        run: |
          New-Item -ItemType Directory share | Out-Null
          .\client\rd.exe run --rm -v "${PWD}\share:/w" fsprobe:ci /w | Out-File -Encoding utf8 transcript-windows.txt
          (Get-Content transcript-windows.txt | Measure-Object -Line).Lines

      - name: diff the transcript against the oracle
        shell: bash
        run: |
          set -euxo pipefail
          sed -i 's/\r$//; 1s/^\xEF\xBB\xBF//' transcript-windows.txt
          bash test/fs-conformance/diff.sh transcript-native.txt transcript-windows.txt test/fs-conformance/deviations-windows.txt | tee fs-conformance-report.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fs-conformance-windows
          path: |
            transcript-windows.txt
            fs-conformance-report.txt
            suggested-deviations.txt
          if-no-files-found: ignore
          retention-days: 7

      # rm destroys the machine as well as the entry, and leaving a
      # distribution behind is the failure worth catching: it is a running
      # Linux system with nothing naming it.
      - name: rm takes the machine with it
        shell: pwsh
        run: |
          .\client\rd.exe remote rm ci
          $distros = (wsl -l -q) -join "`n"
          $distros
          if ($distros -match 'rd-ci') { throw "the distribution outlived the workspace" }

      - name: what the machine had to say
        if: failure()
        shell: pwsh
        continue-on-error: true
        run: |
          wsl -l -v
          wsl -d rd-ci --user root -- cat /etc/wsl.conf
          wsl -d rd-ci --user root -- ps aux
          wsl -d rd-ci --user root -- sh -c "netstat -lnt 2>/dev/null || ss -lnt"

          # Which address Windows can actually reach.
          #
          # The agent logged `listening on :2222` and Windows still refused the
          # connection for three minutes, so the question is no longer whether
          # the agent is up. WSL2 forwards localhost into the machine through a
          # relay, and this asks whether that relay works here at all, or
          # whether the machine is only reachable at its own address.
          wsl --version
          # No shell and no awk: busybox's hostname has no -I, and a shell
          # pipeline here loses its $-fields to PowerShell's quoting. The
          # parsing happens on this side, where it can be seen.
          $addr = (wsl -d rd-ci --user root -- ip -4 -o addr show eth0) -join ' '
          "eth0: $addr"
          $ip = ([regex]::Match($addr, 'inet\s+(\d+\.\d+\.\d+\.\d+)')).Groups[1].Value
          "the machine's own address: $ip"
          Test-NetConnection -ComputerName 127.0.0.1 -Port 2222 -InformationLevel Detailed
          if ($ip) { Test-NetConnection -ComputerName $ip -Port 2222 -InformationLevel Detailed }
          Get-Content "$env:USERPROFILE\.wslconfig" -ErrorAction SilentlyContinue

          # SIGQUIT makes a Go program print every goroutine's stack before it
          # dies, which is the one thing that says where an agent that is
          # running but not listening actually is. It kills the agent, so it
          # goes last and only on the failure path.
          wsl -d rd-ci --user root -- sh -c "pkill -QUIT -f remote-dockerd; sleep 3; cat /var/log/remote-dockerd.log"
