name: machine

# The WSL backend end to end on a Windows runner, which runs real WSL2 (ADR
# 0026). A Linux job builds the image, since a Windows runner cannot, and hands
# the rootfs over. Hyper-V has no job: docs/testing-machines.md is its whole
# verification. Every pull request, because this is the one Windows client in CI.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A container image IS a rootfs, so the machine gets the image CI tests.
  rootfs:
    name: export the workspace image as a rootfs and record the probe oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go

      - name: build the workspace image
        run: docker build -t rd-workspace:ci -f image/Dockerfile .

      - name: export its filesystem
        run: |
          set -eux
          id=$(docker create rd-workspace:ci)
          # Gzipped, as a release publishes it. -1: -9 cost a minute of CPU on
          # the critical path to save bandwidth between two runners.
          docker export "$id" | gzip -1 > rootfs.tar.gz
          docker rm "$id"
          ls -lh rootfs.tar.gz

      # The conformance probe's transcript against the runner's own disk is the
      # ORACLE the wsl job diffs an NTFS-backed share against. build_probe is
      # lib.sh's, so it cannot drift from test/fs-conformance.sh.
      - name: build the probe image and run the oracle
        run: |
          set -eux
          REPO=$PWD
          . test/lib.sh
          build_probe fsprobe "$PWD/fsprobe"
          mkdir -p ctx
          cp test/fs-conformance/Dockerfile fsprobe ctx/
          docker build -t fsprobe:ci ctx
          mkdir -p native
          docker run --rm -v "$PWD/native:/w" fsprobe:ci /w > transcript-native.txt
          wc -l transcript-native.txt
          docker save fsprobe:ci | gzip > fsprobe.tar.gz
          ls -lh fsprobe.tar.gz

      # Cross-compiled HERE: setup-go on the Windows runner restores a 526 MB
      # cache in one to four minutes (248s, run 34212595094, 2026-09-08) to
      # compile one binary in seven seconds. CGO_ENABLED=0 is what
      # .goreleaser.yaml ships for windows; ci.yml's `test (windows)` still
      # compiles natively.
      - name: cross-compile the windows client
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: go build -o rd.exe ./cmd/remote-docker
        working-directory: client

      - uses: actions/upload-artifact@v7
        with:
          name: windows-client
          path: client/rd.exe
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v7
        with:
          name: workspace-rootfs
          path: rootfs.tar.gz
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v7
        with:
          name: fsprobe-image
          path: fsprobe.tar.gz
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v7
        with:
          name: transcript-native
          path: transcript-native.txt
          if-no-files-found: error
          retention-days: 1

  wsl:
    name: a machine on wsl
    runs-on: windows-latest
    needs: rootfs
    # Machine creation, an idle disconnect and 5,000 probe files over the share
    # do not fit in thirty.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      # No setup-go here: everything Go arrives from the Linux job.
      - uses: actions/download-artifact@v8
        with:
          name: workspace-rootfs

      # Into client/, which is where every step below already spells it.
      - uses: actions/download-artifact@v8
        with:
          name: windows-client
          path: client

      # Through GITHUB_ENV, not the job's `env:`: the `runner` context is not
      # available there, and naming it makes the whole file invalid with no
      # pull-request run created at all.
      - name: a state directory of its own
        shell: pwsh
        run: |
          "REMOTE_DOCKER_STATE_DIR=$env:RUNNER_TEMP\rd-state" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: install wsl
        run: wsl --install --no-distribution

      - name: create the machine
        shell: pwsh
        run: |
          .\client\rd.exe remote machine create ci --rootfs .\rootfs.tar.gz
          if ($LASTEXITCODE -ne 0) { throw "machine create failed" }
          .\client\rd.exe remote ls
          .\client\rd.exe remote machine status ci

      # The one that matters: the session, the SSH transport, the NFS export,
      # the bind rewriting and the daemon inside the machine, in one command.
      - name: docker run, with a bind mount from this machine
        shell: pwsh
        run: |
          "from the runner" | Out-File -Encoding ascii marker
          # Joined before matching: -notmatch on an ARRAY filters lines and is
          # truthy whether or not the text is there.
          $out = (.\client\rd.exe run --rm -v "${PWD}:/w" alpine:3 cat /w/marker) -join "`n"
          $out
          if ($out -notmatch 'from the runner') { throw "the bind mount did not resolve" }

      - name: GNU tar sets attributes on files it wrote, and a non-root uid can mkdir
        shell: pwsh
        # GNU tar sets attributes on the descriptor it just wrote, which the
        # kernel cannot retry after ESTALE; both defects that broke it showed
        # only from a Windows client.
        run: |
          $probe = 'apk add -q tar >/dev/null 2>&1 && cd /w && mkdir -p src && echo x >src/a && tar -cf t.tar src && rm -r src && tar -xf t.tar && chmod 600 src/a && echo TAR-OK'
          $out = (.\client\rd.exe run --rm -v "${PWD}:/w" alpine:3 sh -c $probe) -join "`n"
          $out
          if ($out -notmatch 'TAR-OK') { throw "GNU tar could not set attributes on a share" }
          $out = (.\client\rd.exe run --rm --user 1000 -v "${PWD}:/w" alpine:3 sh -c 'mkdir /w/made && echo MKDIR-OK') -join "`n"
          $out
          if ($out -notmatch 'MKDIR-OK') { throw "a non-root uid could not mkdir on a share" }

      - name: creating it again changes nothing
        shell: pwsh
        run: |
          $out = (.\client\rd.exe remote machine create ci --rootfs .\rootfs.tar.gz) -join "`n"
          $out
          if ($out -notmatch 'nothing to do') { throw "create was not idempotent" }

      # A stop must not discard what is inside the machine; only a rebuild does.
      - name: it survives being stopped and started
        shell: pwsh
        run: |
          # Checked one by one: pwsh fails a step on the LAST native exit code
          # only, so a stop that failed would otherwise pass as a survival.
          .\client\rd.exe run -d --name survivor alpine:3 sleep 600
          if ($LASTEXITCODE -ne 0) { throw "could not start the survivor" }
          .\client\rd.exe remote machine stop ci
          if ($LASTEXITCODE -ne 0) { throw "machine stop failed" }
          .\client\rd.exe remote machine start ci
          if ($LASTEXITCODE -ne 0) { throw "machine start failed" }

          # An EOF on the pipe names the wrong layer, so print what holds the
          # endpoint and the session's own log.
          .\client\rd.exe remote status
          Get-Process rd -ErrorAction SilentlyContinue | Format-Table Id, StartTime
          Get-Content "$env:REMOTE_DOCKER_STATE_DIR\logs\*.log" -Tail 40 -ErrorAction SilentlyContinue

          $out = (.\client\rd.exe ps -a --filter name=survivor --format '{{.Names}}') -join "`n"
          $out
          if ($out -notmatch 'survivor') { throw "the container did not survive a restart" }
          .\client\rd.exe rm -f survivor

      # An idle session disconnects after a minute (ADR 0015) and WSL stops
      # the machine. What is under test is the command AFTER that, which once
      # dialled before the restarted agent listened and read as flakiness.
      - name: a machine comes back after sitting idle
        shell: pwsh
        timeout-minutes: 8
        run: |
          # A background session holds the machine; a one-shot run would not.
          .\client\rd.exe remote start
          if ($LASTEXITCODE -ne 0) { throw "remote start failed" }

          # Polled for `Stopped` (106s, measured 2026-09-08), so a machine that
          # never stops fails here naming what wsl said. 300s bounds that.
          $start = Get-Date
          $deadline = $start.AddSeconds(300)
          $state = ""
          while ($true) {
            # NULs stripped: wsl.exe writes UTF-16, which read raw matches
            # nothing.
            $state = ((wsl -l -v | Out-String) -replace "`0", "")
            if ($state -match 'rd-ci +Stopped') { break }
            if ((Get-Date) -ge $deadline) { break }
            Start-Sleep -Seconds 5
          }
          $waited = [int]((Get-Date) - $start).TotalSeconds
          "waited ${waited}s for the machine to stop; wsl -l -v says:"
          $state
          if ($state -notmatch 'rd-ci +Stopped') {
            throw "the machine never stopped while idle, after ${waited}s; wsl -l -v printed above"
          }

          $out = (.\client\rd.exe run --rm -v "${PWD}:/w" alpine:3 cat /w/marker) -join "`n"
          $out
          if ($out -notmatch 'from the runner') { throw "an idle machine did not come back" }
          .\client\rd.exe remote stop

      # test/fs-conformance.sh's probe against an NTFS-backed share, diffed
      # against the ubuntu oracle; an unlisted deviation fails the job.
      - uses: actions/download-artifact@v8
        with:
          name: fsprobe-image

      - uses: actions/download-artifact@v8
        with:
          name: transcript-native

      - name: load the probe image into the machine's daemon
        shell: pwsh
        run: |
          $out = (.\client\rd.exe load -i fsprobe.tar.gz) -join "`n"
          $out
          if ($out -notmatch 'fsprobe') { throw "the probe image was not loaded" }

      - name: run the probe against a share backed by NTFS
        shell: pwsh
        # An explicit encoding, since `>` in Windows PowerShell writes UTF-16.
        # The diff step strips a BOM either way.
        run: |
          New-Item -ItemType Directory share | Out-Null
          .\client\rd.exe run --rm -v "${PWD}\share:/w" fsprobe:ci /w | Out-File -Encoding utf8 transcript-windows.txt
          (Get-Content transcript-windows.txt | Measure-Object -Line).Lines

      - name: diff the transcript against the oracle
        shell: bash
        run: |
          set -euxo pipefail
          sed -i 's/\r$//; 1s/^\xEF\xBB\xBF//' transcript-windows.txt
          bash test/fs-conformance/diff.sh transcript-native.txt transcript-windows.txt test/fs-conformance/deviations-windows.txt | tee fs-conformance-report.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fs-conformance-windows
          path: |
            transcript-windows.txt
            fs-conformance-report.txt
            suggested-deviations.txt
          if-no-files-found: ignore
          retention-days: 7

      # A distribution left behind is a running Linux system nothing names.
      - name: rm takes the machine with it
        shell: pwsh
        run: |
          .\client\rd.exe remote rm ci
          if ($LASTEXITCODE -ne 0) { throw "remote rm failed" }
          # NULs stripped, as in the idle step: read raw, wsl.exe's UTF-16
          # matches nothing and a distribution left behind would pass.
          $distros = ((wsl -l -q | Out-String) -replace "`0", "")
          $distros
          if ($distros -match 'rd-ci') { throw "the distribution outlived the workspace" }

      - name: what the machine had to say
        if: failure()
        shell: pwsh
        continue-on-error: true
        run: |
          wsl -l -v
          wsl -d rd-ci --user root -- cat /etc/wsl.conf
          wsl -d rd-ci --user root -- ps aux
          wsl -d rd-ci --user root -- sh -c "netstat -lnt 2>/dev/null || ss -lnt"

          # Which address Windows can reach: WSL2's localhost relay has refused
          # while the agent listened, and the machine's own address worked.
          wsl --version
          # Parsed on this side: busybox's hostname has no -I, and a shell
          # pipeline loses its $-fields to PowerShell's quoting.
          $addr = (wsl -d rd-ci --user root -- ip -4 -o addr show eth0) -join ' '
          "eth0: $addr"
          $ip = ([regex]::Match($addr, 'inet\s+(\d+\.\d+\.\d+\.\d+)')).Groups[1].Value
          "the machine's own address: $ip"
          Test-NetConnection -ComputerName 127.0.0.1 -Port 2222 -InformationLevel Detailed
          if ($ip) { Test-NetConnection -ComputerName $ip -Port 2222 -InformationLevel Detailed }
          Get-Content "$env:USERPROFILE\.wslconfig" -ErrorAction SilentlyContinue

          # SIGQUIT dumps every goroutine's stack, and kills the agent: last.
          wsl -d rd-ci --user root -- sh -c "pkill -QUIT -f remote-dockerd; sleep 3; cat /var/log/remote-dockerd.log"
