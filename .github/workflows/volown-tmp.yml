name: volume ownership (temporary)

# Temporary: runs test/volume-ownership.sh to settle one reported failure.
# Delete this file and the suite once the answer is recorded.

on:
  push:
    branches: [volume-ownership]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  volume-ownership:
    name: who owns a named volume's mountpoint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - name: load the nfs and fuse modules
        run: sudo modprobe nfs && sudo modprobe fuse
      - name: run the suite
        run: bash test/volume-ownership.sh
      - name: workspace logs on failure
        if: failure()
        run: docker logs remote-docker-volown 2>&1 | tail -100 || true
