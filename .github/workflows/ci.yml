name: ci

# Runs directly on pull requests, and is CALLED by release.yml for pushes to
# main and for tags. That is why there is no `push` trigger here: if both fired
# on a main push, the same checks would run twice and the two runs would fight
# over the concurrency group below.
#
# Being called rather than merely running alongside is what makes a tag safe to
# push -- release.yml waits for this to pass before publishing anything.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Every commit gets its own run, and nothing is ever cancelled by a later push.
#
# This used to cancel an in-flight run when a branch was pushed again, on the
# reasoning that the older run tests code nobody will merge. What that costs is
# the answer you were actually waiting for: a push that fixes one suite kills
# the run that was still telling you about another, and a cancelled job's
# conclusion is not "success", so it reads as a failure in anything scanning
# results.
#
# The group is per SHA rather than per ref, which keeps the one thing
# cancellation was really for -- the same commit triggered twice does not run
# twice -- without a new commit destroying an old commit's answer.
concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: false

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The repo root is deliberately not a module (ADR 0021), so setup-go's
      # default key looks for a go.mod that is not there and restores nothing:
      # every job re-downloaded the whole graph, 250 `go: downloading` lines in
      # this one. Key the cache on the five real modules instead.
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache: true
          cache-dependency-path: |
            core/go.sum
            core-agent/go.sum
            core-client/go.sum
            agent/go.sum
            client/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      # Per module, and every module named explicitly. `./...` stops at a
      # module boundary, so a loop over the five is the only thing that
      # actually covers the repository after ADR 0021 -- and a `go test ./...`
      # at the root would pass while testing almost nothing.
      - name: go vet
        run: |
          set -eux
          for mod in ./core ./agent ./core-agent ./core-client ./client; do
            (cd "$mod" && go vet ./...)
          done

      # -race needs cgo, which is why this runs here and not in the
      # cross-compile matrix below (that one is CGO_ENABLED=0 by necessity).
      - name: go test
        run: |
          set -eux
          for mod in core agent core-agent core-client client; do
            (cd "$mod" && go test -race -coverprofile=coverage.out -covermode=atomic ./...)
          done

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.out
            agent/coverage.out
            client/coverage.out

  # The client, on the platform whose code has no counterpart anywhere else.
  #
  # Everything above runs on Linux, which was defensible while no test was
  # platform-specific. It stopped being: the endpoint is a named PIPE here and
  # a unix socket there, and `processAlive` asks Windows a question -- via
  # GetExitCodeProcess -- that has no meaning on Unix. Both had bugs, both were
  # caught by tests that ran on one developer's machine and nowhere else, which
  # is the one place this project's own premise says not to depend on.
  #
  # The client, core-client and the shared module. Not the agent or core-agent:
  # both are Linux-only by design (useradd, netns, inotify); the cross-compile
  # matrix already keeps their `_other.go` stubs honest, and running their tests
  # here would prove nothing about the machine they actually run on.
  #
  # core-client EARNS a place here rather than inheriting one. Its fswatch has a
  # Windows backend of its own and its NFS server serves this machine's files,
  # so this is the only job where either runs on the OS it was written for.
  #
  # No -race: it needs cgo, and a C toolchain on this runner is a dependency
  # for a check the Linux job already performs on the same code.
  #
  # No gofmt either -- `.gitattributes` forces LF, and a gofmt run on a
  # checkout is a test of git's line endings rather than of the source.
  test-windows:
    name: test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Keyed on the five modules because the root is not one. See ci.yml.
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache: true
          cache-dependency-path: |
            core/go.sum
            core-agent/go.sum
            core-client/go.sum
            agent/go.sum
            client/go.sum

      - name: go test
        shell: bash
        run: |
          set -eux
          for mod in core core-client client; do
            (cd "$mod" && go test ./...)
          done

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Keyed on the five modules because the root is not one. See ci.yml.
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache: true
          cache-dependency-path: |
            core/go.sum
            core-agent/go.sum
            core-client/go.sum
            agent/go.sum
            client/go.sum
      # Built from source with this project's own toolchain rather than taken
      # from the action, whose pinned binary is compiled against an older Go
      # and refuses to load a module targeting a newer one.
      - name: install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      # Per module, and the agent TWICE. Its session handling is Linux-only,
      # so a host-only lint does not see the file at all -- which is how a
      # QF1002 reached CI once already. `./...` stops at a module boundary, so
      # the loop is what makes this cover the repository.
      - name: golangci-lint
        run: |
          set -eux
          for mod in ./core ./agent ./core-agent ./core-client ./client; do
            (cd "$mod" && golangci-lint run --timeout 5m ./...)
          done
          # The agent and core-agent both carry Linux-only files (netns, the unix
          # provisioner, the inotify poker), which a lint on the runner's own
          # GOOS does not see at all.
          (cd agent && GOOS=linux golangci-lint run --timeout 5m ./...)
          (cd core-agent && GOOS=linux golangci-lint run --timeout 5m ./...)

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [windows, linux, darwin]
        goarch: [amd64, arm64]
        # Android added as legs rather than as rows of the grid, so that the
        # windows/darwin/linux cross product stays what it is.
        #
        # These are the only targets built with cgo: Android resolves hostnames
        # through bionic or not at all (ADR 0023), so they need the NDK's
        # compiler. cc is the wrapper's name, and the steps below put the NDK
        # path in front of it.
        include:
          - goos: android
            goarch: arm64
            cgo: 1
            cc: aarch64-linux-android24-clang
          - goos: android
            goarch: amd64
            cgo: 1
            cc: x86_64-linux-android24-clang
    steps:
      - uses: actions/checkout@v7
        with:
          # goreleaser derives a version from git describe, and a shallow clone
          # has no tags to describe against.
          fetch-depth: 0

      # Keyed on the five modules because the root is not one. See ci.yml.
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache: true
          cache-dependency-path: |
            core/go.sum
            core-agent/go.sum
            core-client/go.sum
            agent/go.sum
            client/go.sum

      # Every package of every module, not just the binary: a dependency that
      # quietly needs cgo, or a build-tagged file with no counterpart for this
      # platform, should fail here rather than at release time. goreleaser
      # below builds only the client, so it would not notice.
      #
      # The agent is cross-compiled here too even though it only ever runs on
      # Linux. It costs seconds, and it is what keeps the _other.go stubs
      # honest -- they exist so the package still builds on the machine this
      # project is developed on.
      - name: go build
        env:
          CGO_ENABLED: ${{ matrix.cgo || 0 }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          NDK_CC: ${{ matrix.cc }}
        run: |
          set -eux
          # ANDROID_NDK_HOME is set on the runner image, so nothing is
          # downloaded. Unset it and this fails naming the compiler, which is
          # better than a binary that builds and cannot resolve a hostname.
          if [ -n "${NDK_CC:-}" ]; then
            export CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/$NDK_CC"
          fi
          for mod in ./core ./agent ./core-agent ./core-client ./client; do
            (cd "$mod" && go build ./...)
          done

      # What the embedded Compose reports as its version. Read from the module
      # graph so it cannot drift from go.mod.
      - name: compose version
        run: echo "COMPOSE_VERSION=$(cd client && go list -m -f '{{.Version}}' github.com/docker/compose/v5)" >> "$GITHUB_ENV"

      # The shippable binary, from .goreleaser.yaml -- the same file, flags and
      # naming a tagged release uses, so only the version string differs.
      #
      # --single-target builds just this matrix leg, which shares the build
      # cache with the step above instead of compiling the dependency tree
      # again. This used to be a separate job building all six targets while
      # the matrix compiled all six as well: the same work twice, and the
      # slowest job in the workflow by a factor of two.
      # CC is not set here: .goreleaser.yaml builds it from ANDROID_NDK_HOME
      # itself, so a release and this build cannot disagree about the compiler.
      - uses: goreleaser/goreleaser-action@v7
        env:
          CGO_ENABLED: ${{ matrix.cgo || 0 }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        with:
          version: "~> v2"
          args: build --single-target --snapshot --clean

      # The only assertion these binaries get: nothing in CI can run them, and
      # the facts that decide whether they are loadable at all are in the file.
      # See test/elf.sh and ADR 0023.
      - name: what the binary is
        if: matrix.goos == 'android' || matrix.goos == 'linux'
        run: bash test/elf.sh "${{ matrix.goos }}" "$(find dist -type f -name remote-docker | head -1)"

      # One artifact per platform rather than one holding all six. GitHub zips
      # an artifact whole, so a combined one meant downloading every platform
      # to get the one you wanted.
      #
      # The paths are exact rather than `remote-docker*`, which also matched
      # `remote-dockerd` and swept the AGENT into the client's artifact. It was
      # built and uploaded and nobody could find it, because it was inside
      # something named for the other binary.
      - uses: actions/upload-artifact@v7
        with:
          name: remote-docker-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/**/remote-docker
            dist/**/remote-docker.exe
          if-no-files-found: error
          # Short: six binaries per commit, and the tagged releases are the
          # ones worth keeping.
          retention-days: 14

      # The agent, on the platforms it has (ADR 0025). Its own artifact,
      # because an operator setting up a VM workspace wants 6MB of agent and
      # not 70MB of Docker CLI, and because a binary nobody can find is a
      # binary nobody will use.
      - uses: actions/upload-artifact@v7
        if: matrix.goos == 'linux'
        with:
          name: remote-dockerd-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/**/remote-dockerd
          if-no-files-found: error
          retention-days: 14

  shell:
    name: shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # Only test/ has shell left. The image's scripts and its sudoers file
      # were retired by the Go agent (ADR 0010).
      #
      # The glob is guarded, because an unmatched pattern is passed through
      # verbatim and shellcheck then fails on a file that does not exist --
      # which is how deleting client/ broke this step once already.
      - name: shellcheck
        run: |
          set -eux
          if compgen -G 'test/*.sh' >/dev/null; then
            shellcheck -S warning -s bash test/*.sh
          fi
        shell: bash

  # Pull requests only. On main and on tags, release.yml builds this image for
  # real -- multi-arch and pushed -- so building it here as well would be the
  # same work twice for a strictly weaker result.
  image:
    name: image
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: image/Dockerfile
          push: false
          load: true
          tags: remote-docker-workspace:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
