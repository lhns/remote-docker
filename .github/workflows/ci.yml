name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # -race needs cgo, which is why this runs here and not in the
      # cross-compile matrix below (that one is CGO_ENABLED=0 by necessity).
      - name: go test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Built from source with this project's own toolchain rather than taken
      # from the action, whose pinned binary is compiled against an older Go
      # and refuses to load a module targeting a newer one.
      - name: install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: golangci-lint
        run: golangci-lint run --timeout 5m ./...

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [windows, linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Every package, not just the binaries: a dependency that quietly needs
      # cgo, or a build-tagged file with no counterpart for this platform,
      # should fail here rather than at release time.
      - name: go build
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

      - name: version
        id: v
        run: echo "version=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Built with the same flags goreleaser uses for a tagged release, so
      # what people download from a commit differs from a release only in the
      # version string it reports. A CI artifact built differently from the
      # release is a CI artifact that proves less than it appears to.
      - name: build the client
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          BINARY: remote-docker${{ matrix.goos == 'windows' && '.exe' || '' }}
        run: |
          go build -trimpath \
            -ldflags="-s -w -X main.version=${{ steps.v.outputs.version }}" \
            -o "dist/$BINARY" \
            ./cmd/remote-docker

      - uses: actions/upload-artifact@v4
        with:
          name: remote-docker-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error
          # Short, because this is one artifact per target per commit and the
          # tagged releases are the ones worth keeping.
          retention-days: 14

  shell:
    name: shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # Only test/ has shell left. The image's scripts and its sudoers file
      # were retired by the Go agent (ADR 0010).
      #
      # The glob is guarded, because an unmatched pattern is passed through
      # verbatim and shellcheck then fails on a file that does not exist --
      # which is how deleting client/ broke this step once already.
      - name: shellcheck
        run: |
          set -eux
          if compgen -G 'test/*.sh' >/dev/null; then
            shellcheck -S warning -s bash test/*.sh
          fi
        shell: bash

  image:
    name: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: image/Dockerfile
          push: false
          load: true
          tags: remote-docker-workspace:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
