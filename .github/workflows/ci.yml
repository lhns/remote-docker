name: ci

# Runs directly on pull requests, and is CALLED by release.yml for pushes to
# main and for tags, which is what makes a tag safe to push: release.yml waits
# for this before publishing. No `push` trigger, because both firing on a main
# push would run the same checks twice into one concurrency group.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Per SHA and never cancelled: the same commit triggered twice still runs once,
# and a later push does not destroy an earlier commit's answer. A cancelled
# job's conclusion is not "success", so anything scanning results reads it as a
# failure.
concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: false

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      # `./...` stops at a module boundary (ADR 0021), so the loop is the only
      # thing covering the repository; at the root it would test almost nothing.
      - name: go vet
        run: |
          set -eux
          for mod in ./core ./agent ./core-agent ./core-client ./client ./dircache ./machine ./test/probes; do
            (cd "$mod" && go vet ./...)
          done

      # -race needs cgo, which is why this runs here and not in the
      # cross-compile matrix below (that one is CGO_ENABLED=0 by necessity).
      - name: go test
        run: |
          set -eux
          for mod in core agent core-agent core-client client dircache machine test/probes; do
            (cd "$mod" && go test -race -coverprofile=coverage.out -covermode=atomic ./...)
          done

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            */coverage.out
            test/probes/coverage.out

  # The code that has no counterpart on Linux, on the OS it was written for.
  # The endpoint is a named PIPE here and a unix socket there, `processAlive`
  # asks GetExitCodeProcess a question with no meaning on Unix, core-client's
  # fswatch has a Windows backend, and `machine`'s wsl_windows.go and
  # hyperv_windows.go are build-tagged windows: the Linux jobs never compile
  # them and the cross-compile matrix builds them without running them. Drop a
  # module from this list and its Windows-specific code is tested nowhere.
  #
  # Not the agent or core-agent: both are Linux-only by design (useradd, netns,
  # inotify), and the cross-compile matrix keeps their `_other.go` stubs honest.
  #
  # No -race, which needs cgo and a C toolchain for a check the Linux job
  # already makes; no gofmt, which `.gitattributes` makes a test of git's line
  # endings rather than of the source.
  test-windows:
    name: test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go

      - name: go test
        shell: bash
        run: |
          set -eux
          for mod in core core-client client dircache machine; do
            (cd "$mod" && go test ./...)
          done

  # Go and shell in one job. A job costs a runner slot plus 20-30s of
  # scheduling whatever it does, and shellcheck alone was 17s of work: this
  # account runs twenty jobs at once and one pull request asks for twenty-six.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      # Built from source with this project's own toolchain rather than taken
      # from the action, whose pinned binary is compiled against an older Go
      # and refuses to load a module targeting a newer one.
      - name: install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      # Per module, and the agent and core-agent TWICE: both carry Linux-only
      # files (session handling, netns, the unix provisioner, the inotify
      # poker) that a lint on the runner's own GOOS does not see at all, which
      # is how a QF1002 reached CI once already.
      - name: golangci-lint
        run: |
          set -eux
          for mod in ./core ./agent ./core-agent ./core-client ./client ./dircache ./machine ./test/probes; do
            (cd "$mod" && golangci-lint run --timeout 5m ./...)
          done
          (cd agent && GOOS=linux golangci-lint run --timeout 5m ./...)
          (cd core-agent && GOOS=linux golangci-lint run --timeout 5m ./...)

      - name: install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # -x follows `source`, so the suites are read against the real
      # test/lib.sh; without it every helper it defines is invisible here and
      # half of each suite goes unchecked. Each glob is guarded because an
      # unmatched pattern is passed through verbatim and shellcheck then fails
      # on a file that does not exist, which is how deleting client/ broke this.
      - name: shellcheck
        run: |
          set -eux
          for glob in 'test/*.sh' 'test/fs-conformance/*.sh' 'scripts/*.sh'; do
            if compgen -G "$glob" >/dev/null; then
              # shellcheck disable=SC2086  # the glob is what is being expanded
              shellcheck -x -S warning -s bash $glob
            fi
          done
        shell: bash

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [windows, linux, darwin]
        goarch: [amd64, arm64]
        # Android as legs rather than rows, so the windows/darwin/linux cross
        # product stays what it is. The only targets built with cgo: Android
        # resolves hostnames through bionic or not at all (ADR 0023), so they
        # need the NDK's compiler, named by `cc` and located below.
        include:
          - goos: android
            goarch: arm64
            cgo: 1
            cc: aarch64-linux-android24-clang
          - goos: android
            goarch: amd64
            cgo: 1
            cc: x86_64-linux-android24-clang
    steps:
      - uses: actions/checkout@v7
        with:
          # goreleaser derives a version from git describe, and a shallow clone
          # has no tags to describe against.
          fetch-depth: 0

      - uses: ./.github/actions/setup-go

      # Every package of every module, not just the binary goreleaser builds
      # below: a dependency that quietly needs cgo, or a build-tagged file with
      # no counterpart for this platform, fails here rather than at release
      # time. The agent is included though it only runs on Linux, because this
      # is what keeps its `_other.go` stubs honest.
      - name: go build
        env:
          CGO_ENABLED: ${{ matrix.cgo || 0 }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          NDK_CC: ${{ matrix.cc }}
        run: |
          set -eux
          # ANDROID_NDK_HOME is set on the runner image, so nothing is
          # downloaded. Unset it and this fails naming the compiler, which is
          # better than a binary that builds and cannot resolve a hostname.
          if [ -n "${NDK_CC:-}" ]; then
            export CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/$NDK_CC"
          fi
          for mod in ./core ./agent ./core-agent ./core-client ./client ./dircache ./machine; do
            (cd "$mod" && go build ./...)
          done

      # What the embedded Compose reports as its version. Read from the module
      # graph so it cannot drift from go.mod.
      - name: compose version
        run: echo "COMPOSE_VERSION=$(cd client && go list -m -f '{{.Version}}' github.com/docker/compose/v5)" >> "$GITHUB_ENV"

      # The shippable binary, from .goreleaser.yaml: same file, flags and
      # naming a tagged release uses, so only the version string differs. No CC
      # here, because .goreleaser.yaml derives it from ANDROID_NDK_HOME itself
      # and a release and this build cannot then disagree about the compiler.
      - uses: goreleaser/goreleaser-action@v7
        env:
          CGO_ENABLED: ${{ matrix.cgo || 0 }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        with:
          version: "~> v2"
          args: build --single-target --snapshot --clean

      # The only assertion these binaries get: nothing in CI can run them, and
      # the facts that decide whether they are loadable at all are in the file.
      # See test/elf.sh and ADR 0023.
      - name: what the binary is
        if: matrix.goos == 'android' || matrix.goos == 'linux'
        run: bash test/elf.sh "${{ matrix.goos }}" "$(find dist -type f -name remote-docker | head -1)"

      # One artifact per platform: GitHub zips an artifact whole, so a combined
      # one means downloading every platform to get one. The paths are exact
      # rather than `remote-docker*`, which also matched `remote-dockerd` and
      # swept the AGENT into the client's artifact, where nobody could find it.
      - uses: actions/upload-artifact@v7
        with:
          name: remote-docker-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/**/remote-docker
            dist/**/remote-docker.exe
          if-no-files-found: error
          # Short: six binaries per commit, and the tagged releases are the
          # ones worth keeping.
          retention-days: 14

      # The agent, on the platforms it has (ADR 0025). Its own artifact: an
      # operator setting up a VM workspace wants 6MB of agent, not 70MB of
      # Docker CLI wrapped around it.
      - uses: actions/upload-artifact@v7
        if: matrix.goos == 'linux'
        with:
          name: remote-dockerd-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/**/remote-dockerd
          if-no-files-found: error
          retention-days: 14
