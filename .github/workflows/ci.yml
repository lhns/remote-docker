name: ci

# Runs directly on pull requests, and is CALLED by release.yml for pushes to
# main and for tags, which is what makes a tag safe to push: release.yml waits
# for this before publishing. No `push` trigger, because both firing on a main
# push would run the same checks twice into one concurrency group.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Per SHA and never cancelled: a later push must not destroy an earlier
# commit's answer, and a cancelled job reads as a failure.
concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: false

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      # `./...` stops at a module boundary (ADR 0021), so the loop is the only
      # thing covering the repository; at the root it would test almost nothing.
      - name: go vet
        run: |
          set -eux
          for mod in ./core ./agent ./core-agent ./core-client ./client ./dircache ./machine ./test/probes; do
            (cd "$mod" && go vet ./...)
          done

      # -race needs cgo, which is why this runs here and not in the
      # cross-compile matrix below (that one is CGO_ENABLED=0 by necessity).
      - name: go test
        run: |
          set -eux
          for mod in core agent core-agent core-client client dircache machine test/probes; do
            (cd "$mod" && go test -race -coverprofile=coverage.out -covermode=atomic ./...)
          done

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            */coverage.out
            test/probes/coverage.out

  # The Windows-only code (the named-pipe endpoint, processAlive, fswatch's
  # Windows backend, machine's wsl/hyperv files) runs nowhere else: drop a
  # module from this list and its Windows code is tested nowhere. Not agent or
  # core-agent, which are Linux-only. No -race (needs cgo) and no gofmt
  # (.gitattributes makes that a test of git's line endings).
  test-windows:
    name: test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go

      - name: go test
        shell: bash
        run: |
          set -eux
          for mod in core core-client client dircache machine; do
            (cd "$mod" && go test ./...)
          done

  # Go and shell in one job: a job costs a runner slot and 20-30s of
  # scheduling, and one pull request already asks for twenty-six.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      # Built with this project's toolchain: the action's pinned binary is
      # compiled against an older Go and refuses a module targeting a newer one.
      - name: install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      # The agent and core-agent twice more under GOOS=linux, for their
      # Linux-only files.
      - name: golangci-lint
        run: |
          set -eux
          for mod in ./core ./agent ./core-agent ./core-client ./client ./dircache ./machine ./test/probes; do
            (cd "$mod" && golangci-lint run --timeout 5m ./...)
          done
          (cd agent && GOOS=linux golangci-lint run --timeout 5m ./...)
          (cd core-agent && GOOS=linux golangci-lint run --timeout 5m ./...)

      - name: install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # -x follows `source` into test/lib.sh. Each glob is guarded: an
      # unmatched one reaches shellcheck verbatim as a file that does not exist.
      - name: shellcheck
        run: |
          set -eux
          for glob in 'test/*.sh' 'test/fs-conformance/*.sh' 'scripts/*.sh'; do
            if compgen -G "$glob" >/dev/null; then
              # shellcheck disable=SC2086  # the glob is what is being expanded
              shellcheck -x -S warning -s bash $glob
            fi
          done
        shell: bash

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [windows, linux, darwin]
        goarch: [amd64, arm64]
        # Android as legs rather than rows, so the windows/darwin/linux cross
        # product stays what it is. The only targets built with cgo: Android
        # resolves hostnames through bionic or not at all (ADR 0023), so they
        # need the NDK's compiler, named by `cc` and located below.
        include:
          - goos: android
            goarch: arm64
            cgo: 1
            cc: aarch64-linux-android24-clang
          - goos: android
            goarch: amd64
            cgo: 1
            cc: x86_64-linux-android24-clang
    steps:
      - uses: actions/checkout@v7
        with:
          # goreleaser derives a version from git describe, and a shallow clone
          # has no tags to describe against.
          fetch-depth: 0

      - uses: ./.github/actions/setup-go

      # Every package of every module, not just the binary: a dependency that
      # needs cgo or a build-tagged file with no counterpart fails here, not at
      # release. The agent too, which keeps its `_other.go` stubs honest.
      - name: go build
        env:
          CGO_ENABLED: ${{ matrix.cgo || 0 }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          NDK_CC: ${{ matrix.cc }}
        run: |
          set -eux
          # ANDROID_NDK_HOME is on the runner image; without it this fails
          # naming the compiler rather than building a binary with no DNS.
          if [ -n "${NDK_CC:-}" ]; then
            export CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/$NDK_CC"
          fi
          for mod in ./core ./agent ./core-agent ./core-client ./client ./dircache ./machine; do
            (cd "$mod" && go build ./...)
          done

      # What the embedded Compose reports, read from the module graph.
      - name: compose version
        run: echo "COMPOSE_VERSION=$(cd client && go list -m -f '{{.Version}}' github.com/docker/compose/v5)" >> "$GITHUB_ENV"

      # The shippable binary, built exactly as a release builds it. No CC:
      # .goreleaser.yaml derives it from ANDROID_NDK_HOME itself.
      - uses: goreleaser/goreleaser-action@v7
        env:
          CGO_ENABLED: ${{ matrix.cgo || 0 }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        with:
          version: "~> v2"
          args: build --single-target --snapshot --clean

      # The only assertion these binaries get: nothing in CI can run them, and
      # the facts that decide whether they are loadable at all are in the file.
      # See test/elf.sh and ADR 0023.
      - name: what the binary is
        if: matrix.goos == 'android' || matrix.goos == 'linux'
        run: bash test/elf.sh "${{ matrix.goos }}" "$(find dist -type f -name remote-docker | head -1)"

      # One artifact per platform, since GitHub zips an artifact whole. Exact
      # paths: `remote-docker*` also matches `remote-dockerd`.
      - uses: actions/upload-artifact@v7
        with:
          name: remote-docker-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/**/remote-docker
            dist/**/remote-docker.exe
          if-no-files-found: error
          retention-days: 14

      # The agent on its own (ADR 0025): 6MB, not 70MB of Docker CLI around it.
      - uses: actions/upload-artifact@v7
        if: matrix.goos == 'linux'
        with:
          name: remote-dockerd-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/**/remote-dockerd
          if-no-files-found: error
          retention-days: 14
