name: kubernetes

# The chart on a kind cluster, reached through an ingress with the client
# binary. dockerd in a pod in a kind node is docker in docker in docker, which
# was measured to work (2026-08-14) before the chart was written.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:

permissions:
  contents: read

# Never cancelled by a newer run, and each commit is its own group: a later
# push must not destroy an earlier commit's answer (why: ci.yml).
concurrency:
  group: kubernetes-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # Not path-gated: it finishes inside the integration suites' ten minutes, and
  # a gate would let an agent change reach main without running on a cluster.
  end-to-end:
    name: a session through the ingress
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # StatefulSet of one, so the name is the release plus an ordinal.
      POD: ws-remote-docker-workspace-0
    steps:
      - uses: actions/checkout@v7

      # The chart's own checks run FIRST, so a chart that cannot render fails
      # in twenty seconds. Folded in from a job of their own (runner slots are
      # scarce: ci.yml, lint). helm is pinned for the whole job.
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.3

      - name: helm lint
        run: helm lint charts/remote-docker-workspace

      - name: install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/

      # Every combination somebody can install, against real API schemas.
      # pipefail: helm failing leaves kubeconform an empty stdin, which it
      # passes as "0 resources found".
      - name: helm template, each way it can be configured
        run: |
          set -euxo pipefail
          render() {
            helm template ws charts/remote-docker-workspace --kube-version 1.29.0 "$@" \
              | kubeconform -strict -kubernetes-version 1.29.0 -summary -
          }
          render --set ingress.host=ws.example.com
          render --set ingress.enabled=false
          render --set ingress.host=ws.example.com --set existingSecret=my-keys
          render --set ingress.host=ws.example.com --set perUserDind=false --set dockerdArgs=""
          render --set ingress.host=ws.example.com \
                 --set authorizedKeys.alice="ssh-ed25519 AAAAtest alice@laptop"
          render --set ingress.host=ws.example.com \
                 --set persistence.graph.existingClaim=graph-x \
                 --set persistence.state.existingClaim=state-x
          render --set ingress.host=ws.example.com \
                 --set persistence.graph.existingClaim=graph-x
          render --set ingress.host=ws.example.com \
                 --set authorizedKeys.ci="ssh-ed25519 AAAAtest ci@runner" \
                 --set 'ephemeral.accounts={ci}' --set ephemeral.cleanupContainers=true
          render --set ingress.enabled=false --set publicURL=wss://ws.example.com/
          render --set ingress.host=ws.example.com --set 'admins={alice,bob}'
          render --set ingress.host=ws.example.com --set metrics.enabled=true --set metrics.port=9100

      # Metrics (ADR 0054): the variable, the port and the scrape annotations
      # when enabled, and none of them by default.
      - name: metrics render
        run: |
          set -eu
          render() {
            helm template ws charts/remote-docker-workspace --kube-version 1.29.0 \
              --set ingress.host=ws.example.com --show-only templates/statefulset.yaml "$@"
          }
          on=$(render --set metrics.enabled=true --set metrics.port=9100)
          for want in 'value: ":9100"' 'name: metrics' 'containerPort: 9100' \
                      'prometheus.io/scrape: "true"' 'prometheus.io/port: "9100"' 'prometheus.io/path: /metrics'; do
            if ! grep -qF -- "$want" <<<"$on"; then
              echo "metrics.enabled rendered no $want:"; echo "$on"; exit 1
            fi
          done
          off=$(render)
          if grep -qE 'WORKSPACE_METRICS_ADDR|prometheus.io|name: metrics' <<<"$off"; then
            echo "metrics are off by default, yet something rendered:"; echo "$off"; exit 1
          fi

      # Admins (ADR 0053): the list joined into one variable, nothing for an
      # empty one, and an env entry winning.
      - name: admins render as WORKSPACE_ADMINS
        run: |
          set -eu
          render() {
            helm template ws charts/remote-docker-workspace --kube-version 1.29.0 \
              --set ingress.host=ws.example.com --show-only templates/statefulset.yaml "$@"
          }
          two=$(render --set 'admins={alice,bob}')
          if [ "$(grep -A1 'name: WORKSPACE_ADMINS' <<<"$two" | grep -c 'value: "alice,bob"')" -ne 1 ]; then
            echo "admins did not render as WORKSPACE_ADMINS=alice,bob:"; echo "$two"; exit 1
          fi
          none=$(render)
          if grep -q WORKSPACE_ADMINS <<<"$none"; then
            echo "an empty list set WORKSPACE_ADMINS"; exit 1
          fi
          over=$(render --set 'admins={alice}' --set env.WORKSPACE_ADMINS=bob)
          if [ "$(grep -c 'name: WORKSPACE_ADMINS' <<<"$over")" -ne 1 ]; then
            echo "admins was rendered beside an env entry:"; echo "$over"; exit 1
          fi

      # An env entry wins over EVERY variable the chart sets, rendered once: a
      # duplicate name is last-wins in a pod and can be refused by server-side
      # apply.
      - name: env overrides each variable the chart sets
        run: |
          set -eu
          out=$(helm template ws charts/remote-docker-workspace --kube-version 1.29.0 \
            --set ingress.host=ws.example.com --show-only templates/statefulset.yaml \
            --set-string env.DOCKER_TLS_CERTDIR=/certs \
            --set-string env.WORKSPACE_PER_USER_DIND=false \
            --set-string env.WORKSPACE_DOCKERD_ARGS=--storage-driver=vfs \
            --set-string env.WORKSPACE_DIND_IMAGE=example/dind:1)
          for pair in 'DOCKER_TLS_CERTDIR=/certs' 'WORKSPACE_PER_USER_DIND=false' \
                      'WORKSPACE_DOCKERD_ARGS=--storage-driver=vfs' 'WORKSPACE_DIND_IMAGE=example/dind:1'; do
            name=${pair%%=*}; want=${pair#*=}
            if [ "$(grep -c "name: $name\$" <<<"$out")" -ne 1 ] \
               || [ "$(grep -A1 "name: $name\$" <<<"$out" | grep -c "value: \"$want\"")" -ne 1 ]; then
              echo "$name was not rendered once with the env value:"; echo "$out"; exit 1
            fi
          done

      # Ephemeral accounts (ADR 0050): every variable rendered, nothing for an
      # empty list, an env entry winning, and each bad value refused by name.
      - name: ephemeral accounts render, and bad values are refused
        run: |
          set -eu
          render() {
            helm template ws charts/remote-docker-workspace --kube-version 1.29.0 \
              --set ingress.host=ws.example.com --show-only templates/statefulset.yaml "$@"
          }
          key='authorizedKeys.ci=ssh-ed25519 AAAAtest ci@runner'
          # The value under a variable's name, as rendered.
          has() {
            case "$1" in
              *"name: $2
                        value: \"$3\""*) ;;
              *) echo "$2 is not \"$3\":"; echo "$1"; exit 1 ;;
            esac
          }

          all=$(render --set "$key" --set 'ephemeral.accounts={ci}' \
                       --set ephemeral.maxClients=4 --set ephemeral.grace=90s \
                       --set ephemeral.cleanupContainers=true)
          has "$all" WORKSPACE_EPHEMERAL_ACCOUNTS ci
          has "$all" WORKSPACE_EPHEMERAL_MAX_CLIENTS 4
          has "$all" WORKSPACE_EPHEMERAL_GRACE 90s
          has "$all" WORKSPACE_EPHEMERAL_CLEANUP_CONTAINERS true
          case "$all" in
            *checksum/ephemeral:*) ;;
            *) echo "no checksum/ephemeral annotation:"; echo "$all"; exit 1 ;;
          esac

          none=$(render --set "$key")
          case "$none" in
            *WORKSPACE_EPHEMERAL*|*checksum/ephemeral*) echo "an empty list set something:"; echo "$none"; exit 1 ;;
          esac

          over=$(render --set "$key" --set 'ephemeral.accounts={ci}' --set env.WORKSPACE_EPHEMERAL_GRACE=5m)
          has "$over" WORKSPACE_EPHEMERAL_GRACE 5m
          case "$over" in
            *'value: "2m"'*) echo "the chart's grace was rendered beside the env entry:"; echo "$over"; exit 1 ;;
          esac

          # An existingSecret is not read at render time, so its accounts are trusted.
          secret=$(render --set existingSecret=my-keys --set 'ephemeral.accounts={ci}')
          has "$secret" WORKSPACE_EPHEMERAL_ACCOUNTS ci

          refused() {
            want=$1; shift
            if out=$(render "$@" 2>&1); then
              echo "rendered; wanted a refusal naming $want"; exit 1
            fi
            case "$out" in
              *"$want"*) ;;
              *) echo "refused, but not naming $want: $out"; exit 1 ;;
            esac
          }
          refused ephemeral.grace --set "$key" --set 'ephemeral.accounts={ci}' --set ephemeral.grace=soon
          refused ephemeral.grace --set "$key" --set 'ephemeral.accounts={ci}' --set ephemeral.grace=0s
          refused ephemeral.maxClients --set "$key" --set 'ephemeral.accounts={ci}' --set ephemeral.maxClients=0
          refused '"bob" has no key' --set "$key" --set 'ephemeral.accounts={ci,bob}'

      # A volume is EITHER a supplied claim or a template. Both directions fail
      # silently: a claim named nowhere is a pod with no storage, one named
      # twice a duplicate volume.
      - name: existingClaim replaces its template, and only its own
        run: |
          set -eu
          render() {
            helm template ws charts/remote-docker-workspace --kube-version 1.29.0 "$@"
          }
          both=$(render --set ingress.host=ws.example.com \
                        --set persistence.graph.existingClaim=graph-x \
                        --set persistence.state.existingClaim=state-x)
          case "$both" in
            *volumeClaimTemplates*) echo "both claims supplied, a template was still rendered"; exit 1 ;;
          esac
          for want in "claimName: graph-x" "claimName: state-x"; do
            case "$both" in
              *"$want"*) ;;
              *) echo "missing $want"; exit 1 ;;
            esac
          done

          # Supplying one claim must not take the other template away.
          mixed=$(render --set ingress.host=ws.example.com \
                         --set persistence.graph.existingClaim=graph-x)
          case "$mixed" in
            *"claimName: graph-x"*) ;;
            *) echo "the supplied graph claim was not mounted"; exit 1 ;;
          esac
          case "$mixed" in
            *volumeClaimTemplates*) ;;
            *) echo "the generated state template disappeared"; exit 1 ;;
          esac

          # Assigned first: a failed render inside `case "$(...)"` is ignored.
          default=$(render --set ingress.host=ws.example.com)
          case "$default" in
            *claimName*) echo "the default mounted a claim it does not create"; exit 1 ;;
          esac

      # A volumeClaimTemplate is immutable, so a label that moves with the chart
      # forbids every later upgrade, and only the API server says so.
      - name: a volume claim template does not move with the chart version
        run: |
          set -eu
          claims() {
            rm -rf "$RUNNER_TEMP/chart-$1"
            cp -r charts/remote-docker-workspace "$RUNNER_TEMP/chart-$1"
            sed -i "s/^version: .*/version: $1/; s/^appVersion: .*/appVersion: \"$1\"/" \
              "$RUNNER_TEMP/chart-$1/Chart.yaml"
            helm template ws "$RUNNER_TEMP/chart-$1" --kube-version 1.29.0 \
              --set ingress.host=ws.example.com \
              --set image.tag=pinned \
              --set commonLabels.rolled="v$1" \
              --show-only templates/statefulset.yaml \
              | sed -n '/^  volumeClaimTemplates:/,$p'
          }
          claims 9.9.9  >"$RUNNER_TEMP/claims-a.yaml"
          claims 9.9.10 >"$RUNNER_TEMP/claims-b.yaml"
          if ! [ -s "$RUNNER_TEMP/claims-a.yaml" ]; then
            echo "no volumeClaimTemplates rendered; this check would pass on anything"
            exit 1
          fi
          if ! diff -u "$RUNNER_TEMP/claims-a.yaml" "$RUNNER_TEMP/claims-b.yaml"; then
            echo "the claims differ between two chart versions, so an upgrade across them is refused"
            exit 1
          fi

      # An ingress with no host matches every request, so the chart refuses
      # one. Captured, never `| grep -q` (why: test/lib.sh).
      - name: an ingress with no host is refused
        run: |
          if out=$(helm template ws charts/remote-docker-workspace --kube-version 1.29.0 2>&1); then
            echo "an ingress with no host rendered; it should have been refused"
            exit 1
          fi
          case "$out" in
            *"ingress.host is required"*) ;;
            *) echo "refused, but not by name: $out"; exit 1 ;;
          esac

      - uses: ./.github/actions/setup-go

      - name: load the nfs client module
        run: sudo modprobe nfs

      - name: build the workspace image
        run: docker build -t remote-docker-workspace:kind -f image/Dockerfile .

      - name: build the client
        run: (cd client && CGO_ENABLED=0 go build -o "$RUNNER_TEMP/remote-docker" ./cmd/remote-docker)

      # The node's port 80 is published to the runner (test/kind.yaml).
      - name: create a cluster with an ingress-ready node
        uses: helm/kind-action@v1
        with:
          cluster_name: rd
          wait: 120s
          config: test/kind.yaml

      - name: load the image into the cluster
        run: kind load docker-image remote-docker-workspace:kind --name rd

      - name: install ingress-nginx
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.3/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=300s

      # A ready controller does not mean its admission webhook answers (#151:
      # refused 0.3s after `condition met`). A server-side dry-run CREATE asks
      # it over the path `helm install` takes; the webhook declares
      # `sideEffects: None` (2026-09-08, the deploy.yaml pinned above).
      - name: the admission webhook answers
        run: |
          set -eu
          probe="$RUNNER_TEMP/webhook-probe.yaml"
          cat >"$probe" <<'YAML'
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: admission-webhook-probe
            namespace: default
          spec:
            ingressClassName: nginx
            rules:
              - host: probe.invalid
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: no-such-service
                          port:
                            number: 80
          YAML

          last="(never ran)"
          for i in $(seq 1 60); do
            if last=$(kubectl create --dry-run=server -f "$probe" 2>&1); then
              echo "the admission webhook answered on attempt $i"
              exit 0
            fi
            sleep 2
          done

          echo "the admission webhook never answered in 120s; its last refusal:"
          echo "$last"
          echo "== the admission endpoint =="
          kubectl get endpoints -n ingress-nginx ingress-nginx-controller-admission -o wide || true
          echo "== the controller =="
          kubectl get pods -n ingress-nginx -o wide || true
          kubectl describe pods -n ingress-nginx \
            --selector=app.kubernetes.io/component=controller | tail -40 || true
          echo "== the controller's log =="
          kubectl logs -n ingress-nginx \
            --selector=app.kubernetes.io/component=controller --tail=60 || true
          exit 1

      - name: install the chart
        run: |
          set -eux
          kubectl create namespace rd
          kubectl label namespace rd pod-security.kubernetes.io/enforce=privileged

          # The client's own key, enrolled as the account it will log in as.
          REMOTE_DOCKER_STATE_DIR="$RUNNER_TEMP/state" "$RUNNER_TEMP/remote-docker" remote enroll >/dev/null
          # One key for every pod of the client Deployment below, whose account
          # is ephemeral (ADR 0050). A short grace, so scaling down is checked
          # in seconds rather than the default two minutes.
          REMOTE_DOCKER_STATE_DIR="$RUNNER_TEMP/pods-state" "$RUNNER_TEMP/remote-docker" remote enroll >/dev/null

          helm install ws charts/remote-docker-workspace \
            --namespace rd \
            --set image.repository=remote-docker-workspace \
            --set image.tag=kind \
            --set image.pullPolicy=Never \
            --set ingress.host=ws.rd.test \
            --set ingress.className=nginx \
            --set ingress.tls.enabled=false \
            --set persistence.graph.size=8Gi \
            --set persistence.state.size=1Gi \
            --set-file authorizedKeys.ci="$RUNNER_TEMP/state/id_ed25519.pub" \
            --set-file authorizedKeys.pods="$RUNNER_TEMP/pods-state/id_ed25519.pub" \
            --set 'ephemeral.accounts={pods}' \
            --set ephemeral.grace=20s \
            --set ephemeral.cleanupContainers=true \
            --wait --timeout 10m

      - name: the workspace is up
        run: |
          kubectl get pods -n rd -o wide
          kubectl exec -n rd "$POD" -- remote-dockerd healthcheck

      # `kind load` fills the NODE's containerd, not the workspace's own
      # dockerd, which would pull a per-account daemon's image from a registry.
      - name: give the workspace's own daemon the image
        run: |
          docker save remote-docker-workspace:kind | kubectl exec -i -n rd "$POD" -- docker load

      - name: reach it through the ingress, over ws
        run: |
          set -eux
          echo "127.0.0.1 ws.rd.test" | sudo tee -a /etc/hosts

          export REMOTE_DOCKER_STATE_DIR="$RUNNER_TEMP/state"
          export REMOTE_DOCKER_ENDPOINT="$RUNNER_TEMP/docker.sock"

          # ws: kind's ingress serves plain HTTP; the transport is the same.
          "$RUNNER_TEMP/remote-docker" remote create k8s \
            --host ws://ws.rd.test --user ci --no-context

          # Selected by the environment: --workspace is a flag on `remote`,
          # and the root of this binary is the Docker CLI (ADR 0024).
          export REMOTE_DOCKER_WORKSPACE=k8s
          # No session yet, so the verdict is not ready and status exits 1.
          # The account row is what says the workspace answered.
          out=$("$RUNNER_TEMP/remote-docker" remote status || true)
          echo "$out"
          grep -q "tunnel port" <<<"$out"

      # The whole chain in one command: written on the runner, read in the pod.
      - name: a bind mount from the runner into a container in the cluster
        run: |
          set -eux
          export REMOTE_DOCKER_STATE_DIR="$RUNNER_TEMP/state"
          export REMOTE_DOCKER_ENDPOINT="$RUNNER_TEMP/docker.sock"

          export REMOTE_DOCKER_WORKSPACE=k8s

          mkdir -p "$RUNNER_TEMP/project"
          echo "from the runner" > "$RUNNER_TEMP/project/marker"
          cd "$RUNNER_TEMP/project"

          out=$(timeout 240 "$RUNNER_TEMP/remote-docker" run --rm \
                  -v "$RUNNER_TEMP/project:/w" alpine:3 cat /w/marker)
          test "$out" = "from the runner"

      # Ephemeral clients (ADR 0050) the way autoscaled CI runners use them:
      # pods of one Deployment with random names, one key from one Secret, the
      # same checkout path in each, and no privileges. The namespace enforces
      # the `restricted` Pod Security Standard, so a client that needed more
      # would not be admitted at all.
      - name: build a client image
        run: |
          set -eux
          ctx="$RUNNER_TEMP/client-image"
          mkdir -p "$ctx"
          cp "$RUNNER_TEMP/remote-docker" "$ctx/"
          cat >"$ctx/Dockerfile" <<'DOCKERFILE'
          FROM alpine:3
          RUN apk add --no-cache curl
          COPY remote-docker /usr/local/bin/remote-docker
          RUN ln -s remote-docker /usr/local/bin/docker
          USER 1000:1000
          DOCKERFILE
          docker build -t rd-client:kind "$ctx"
          kind load docker-image rd-client:kind --name rd

      - name: a client Deployment of one ephemeral key
        run: |
          set -eux
          kubectl create namespace clients
          kubectl label namespace clients pod-security.kubernetes.io/enforce=restricted
          kubectl create secret generic -n clients pods-key \
            --from-file=id_ed25519="$RUNNER_TEMP/pods-state/id_ed25519" \
            --from-file=id_ed25519.pub="$RUNNER_TEMP/pods-state/id_ed25519.pub"

          # Every pod writes its own name to /work/marker, so a container that
          # reads it says which pod's export served it.
          kubectl apply -f - <<'YAML'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ci-client
            namespace: clients
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: ci-client
            template:
              metadata:
                labels:
                  app: ci-client
              spec:
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 1000
                  runAsGroup: 1000
                  fsGroup: 1000
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: client
                    image: rd-client:kind
                    imagePullPolicy: Never
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: [ALL]
                    env:
                      - name: REMOTE_DOCKER_HOST
                        value: ws-remote-docker-workspace.rd.svc.cluster.local
                      - name: REMOTE_DOCKER_PORT
                        value: "2222"
                      - name: REMOTE_DOCKER_USER
                        value: pods
                      - name: REMOTE_DOCKER_STATE_DIR
                        value: /state
                      - name: REMOTE_DOCKER_ENDPOINT
                        value: /state/docker.sock
                      - name: POD_NAME
                        valueFrom:
                          fieldRef:
                            fieldPath: metadata.name
                    command: ["sh", "-c"]
                    args:
                      - |
                        set -e
                        cp /key/id_ed25519 /key/id_ed25519.pub /state/
                        chmod 600 /state/id_ed25519
                        echo "$POD_NAME" >/work/marker
                        cd /work
                        exec remote-docker remote start --foreground
                    readinessProbe:
                      exec:
                        command: ["sh", "-c", "test -S /state/docker.sock"]
                      periodSeconds: 2
                    volumeMounts:
                      - {name: key, mountPath: /key, readOnly: true}
                      - {name: state, mountPath: /state}
                      - {name: work, mountPath: /work}
                volumes:
                  - name: key
                    secret:
                      secretName: pods-key
                      defaultMode: 0440
                  - {name: state, emptyDir: {}}
                  - {name: work, emptyDir: {}}
          YAML
          kubectl rollout status -n clients deployment/ci-client --timeout=180s

      # 1 -> 4 -> 1. In each pod: `docker info`, and a bind mount of /work, the
      # same path in every pod, reading that pod's own name. After scaling down,
      # everything the three removed pods made goes once their grace is up.
      - name: scale the client Deployment 1, 4, 1
        run: |
          set -u
          ws() { kubectl exec -n rd "$POD" -- "$@"; }
          pods() {
            kubectl get pods -n clients -l app=ci-client \
              --field-selector=status.phase=Running -o jsonpath='{.items[*].metadata.name}'
          }
          client_of() {
            kubectl exec -n clients "$1" -- curl -s --max-time 30 --unix-socket /state/docker.sock \
              http://session/_remote-docker/client | sed -n 's/.*"client":"\([0-9a-f]*\)".*/\1/p'
          }
          fail() { echo "FAIL  $*"; exit 1; }

          check_pods() {
            local pod out
            for pod in $(pods); do
              out=$(timeout 240 kubectl exec -n clients "$pod" -- docker info 2>&1) ||
                fail "$pod: docker info failed: $(echo "$out" | tail -5)"
              out=$(timeout 240 kubectl exec -n clients "$pod" -- \
                      docker run --rm -v /work:/w alpine:3 cat /w/marker 2>&1)
              [ "$(echo "$out" | tail -1)" = "$pod" ] || fail "$pod: its container read [$out]"
              echo "PASS  $pod: docker info, and a bind mount of /work reads its own name"
            done
          }

          # Rolled out counts ready pods; terminating ones are waited out too.
          scale() {
            kubectl scale -n clients deployment/ci-client --replicas="$1"
            kubectl rollout status -n clients deployment/ci-client --timeout=180s
            for _ in $(seq 1 90); do
              [ "$(kubectl get pods -n clients -l app=ci-client --no-headers | grep -c .)" -eq "$1" ] && return 0
              sleep 2
            done
            fail "the Deployment never settled at $1 pods: $(kubectl get pods -n clients 2>&1)"
          }

          check_pods
          scale 4
          check_pods

          declare -A client
          for pod in $(pods); do client[$pod]=$(client_of "$pod"); done
          echo "clients: ${client[*]}"
          [ "$(printf '%s\n' "${client[@]}" | grep -c '^[0-9a-f]\{8\}$')" -eq 4 ] ||
            fail "four pods do not have four client ids: [${client[*]}]"
          [ "$(printf '%s\n' "${client[@]}" | sort -u | grep -c .)" -eq 4 ] ||
            fail "two pods share a client id: [${client[*]}]"
          runs=$(ws remote-dockerd ephemeral ls 2>&1)
          echo "$runs"
          [ "$(echo "$runs" | grep -c '^pods ')" -eq 4 ] || fail "the workspace does not list four runs"
          echo "PASS  four pods of one key are four runs"

          scale 1
          left=$(pods)
          kept=${client[$left]:-}
          [ -n "$kept" ] || fail "the remaining pod [$left] was not one of the four"

          # One grace (20s) and a sweep, then the cleanup itself.
          gone=false
          for _ in $(seq 1 120); do
            runs=$(ws remote-dockerd ephemeral ls 2>&1)
            vols=$(ws docker exec rd-dind-pods docker volume ls -q \
                     --filter label=com.github.lhns.remote-docker.owner=pods 2>&1)
            # grep -v selecting nothing is the success case, and exits 1 under bash -e.
            others=$(echo "$vols" | grep -v "^rd-$kept-" || true)
            if [ "$(echo "$runs" | grep -c '^pods ')" -eq 1 ] &&
               [ "$(echo "$runs" | awk -v c="$kept" '$1 == "pods" && $2 == c' | grep -c .)" -eq 1 ] &&
               [ -n "$vols" ] && [ -z "$others" ]; then
              gone=true
              break
            fi
            sleep 1
          done
          echo "runs:"; echo "$runs"
          echo "volumes:"; echo "$vols"
          [ "$gone" = true ] || fail "the removed pods' runs or volumes are still there"
          echo "PASS  after scaling to one, only $left's run ($kept) and its volume remain"

          check_pods

      # ADR 0051: a second device enrols its own key with a token, through the
      # ingress. The key lands on the state volume, and the authorizedKeys
      # Secret is the operator's and stays as it was.
      - name: redeem an enrolment token through the ingress
        run: |
          set -eux
          secret_before=$(kubectl get secret -n rd ws-remote-docker-workspace-keys -o jsonpath='{.data}')

          # The invite's address is WORKSPACE_PUBLIC_URL, derived from the ingress.
          line=$(kubectl exec -n rd "$POD" -- remote-dockerd token create --account dana)
          echo "$line"
          invite=$(awk '/--token/ {print $NF}' <<<"$line")
          case "$line" in
            "docker remote create ws --token rdt1."*) ;;
            *) echo "token create printed no command to run"; exit 1 ;;
          esac

          export REMOTE_DOCKER_STATE_DIR="$RUNNER_TEMP/state2"
          # kubectl finds its config under HOME, which is about to move.
          export KUBECONFIG="${KUBECONFIG:-$HOME/.kube/config}"
          export HOME="$RUNNER_TEMP/home2"
          mkdir -p "$HOME"
          "$RUNNER_TEMP/remote-docker" remote create k8s2 --token "$invite" --no-context

          key=$(cut -d' ' -f2 "$REMOTE_DOCKER_STATE_DIR/id_ed25519.pub")
          enrolled=$(kubectl exec -n rd "$POD" -- cat /etc/workspace/enrolled_keys.d/dana.pub)
          echo "$enrolled"
          grep -qF "$key" <<<"$enrolled"
          test "$(kubectl get secret -n rd ws-remote-docker-workspace-keys -o jsonpath='{.data}')" = "$secret_before"

          out=$(REMOTE_DOCKER_WORKSPACE=k8s2 "$RUNNER_TEMP/remote-docker" remote status || true)
          echo "$out"
          grep -q "tunnel port" <<<"$out"

          if out=$("$RUNNER_TEMP/remote-docker" remote create k8s3 --token "$invite" --no-context 2>&1); then
            echo "a used token was redeemed again: $out"
            exit 1
          fi
          echo "$out"
          grep -q "unknown, used or expired" <<<"$out"

      - name: helm upgrade keeps it running
        run: |
          set -eux
          # A new version and appVersion: the upgrade that fails when something
          # version-bearing reached an immutable field.
          rm -rf "$RUNNER_TEMP/chart-next"
          cp -r charts/remote-docker-workspace "$RUNNER_TEMP/chart-next"
          sed -i 's/^version: .*/version: 9.9.9/; s/^appVersion: .*/appVersion: "9.9.9"/' \
            "$RUNNER_TEMP/chart-next/Chart.yaml"
          helm upgrade ws "$RUNNER_TEMP/chart-next" \
            --namespace rd --reuse-values \
            --set resources.requests.memory=256Mi \
            --wait --timeout 10m
          kubectl exec -n rd "$POD" -- remote-dockerd healthcheck

      - name: what went wrong
        if: failure()
        run: |
          echo "== client pods =="
          kubectl get pods -n clients -o wide 2>&1 || true
          for p in $(kubectl get pods -n clients -o name 2>/dev/null); do
            echo "-- $p"
            kubectl logs -n clients "$p" --tail=30 2>&1 || true
          done
          kubectl exec -n rd "$POD" -- remote-dockerd ephemeral ls 2>&1 || true

          echo "== client =="
          cat "$RUNNER_TEMP/state/logs/"*.log 2>/dev/null | tail -60

          echo "== workspace =="
          kubectl describe pod -n rd "$POD" | tail -30 || true
          kubectl logs -n rd "$POD" --tail=100 || true

          # A per-account daemon's reason for not starting is only in its log.
          echo "== per-account daemons =="
          kubectl exec -n rd "$POD" -- docker ps -a 2>&1 | tail -5 || true
          for c in $(kubectl exec -n rd "$POD" -- docker ps -aq --filter name=rd-dind 2>/dev/null); do
            kubectl exec -n rd "$POD" -- docker logs --tail 30 "$c" 2>&1 | tail -30 || true
          done

          echo "== ingress =="
          kubectl logs -n ingress-nginx -l app.kubernetes.io/component=controller --tail=40 || true
