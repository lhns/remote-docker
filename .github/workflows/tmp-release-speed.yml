name: tmp release speed

# TEMPORARY, removed before the PR is finished.
on:
  pull_request:
    paths: [".github/workflows/tmp-release-speed.yml", ".goreleaser.yaml", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot-new:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-go
      - id: gocache
        run: echo "dir=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      # Exact on a re-run of this job (same run id), which is the warm case.
      - uses: actions/cache@v6
        with:
          path: ${{ steps.gocache.outputs.dir }}
          key: tmp-gobuild-${{ github.run_id }}
          restore-keys: tmp-gobuild-
      - name: compose version
        run: echo "COMPOSE_VERSION=$(cd client && go list -m -f '{{.Version}}' github.com/docker/compose/v5)" >> "$GITHUB_ENV"
      - uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v1.14.0
      - name: snapshot release with the new config
        run: |
          # A version syft can read as a release, in place of sha-<commit>.
          sed -i 's/version_template: "sha-{{ .ShortCommit }}"/version_template: "0.99.0"/' .goreleaser.yaml
          grep -n version_template .goreleaser.yaml
          curl -sSfL https://github.com/goreleaser/goreleaser/releases/download/v2.19.0/goreleaser_Linux_x86_64.tar.gz | tar xz -C "$RUNNER_TEMP" goreleaser
          "$RUNNER_TEMP/goreleaser" release --snapshot --clean --skip=publish,sign,announce --verbose 2>&1 |
            while IFS= read -r l; do printf '%s %s\n' "$(date +%T)" "$l"; done | tee "$RUNNER_TEMP/new.log" | cut -c1-300
      - name: wall times
        run: |
          grep -E "software bill|took:|release succeeded|building  .*paths=agent|^.{9}.*archiving" "$RUNNER_TEMP/new.log" | sed -n '1,4p;/software/,$p' | cut -c1-200 || true
          grep -E "building " "$RUNNER_TEMP/new.log" | head -2 | cut -c1-120
          grep -E "took:" "$RUNNER_TEMP/new.log" | cut -c1-120
      - name: files against v0.16.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          gh release view v0.16.2 -R lhns/remote-docker --json assets --jq '.assets[].name' |
            grep -v -E '\.msi$|workspace' | sed 's/0\.16\.2/0.99.0/g' | sort > "$RUNNER_TEMP/expected.txt"
          ls -1 | grep -E '\.(tar\.gz|zip|json)$|^checksums.txt$' | grep -v -E '^(artifacts|metadata|config)\.' | sort > "$RUNNER_TEMP/actual.txt"
          echo "--- expected vs actual (empty diff is a match)"
          diff "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt" && echo SAME FILES
          echo "--- checksums.txt names vs v0.16.2's"
          gh release download v0.16.2 -R lhns/remote-docker -p checksums.txt -O "$RUNNER_TEMP/old-checksums.txt"
          diff <(awk '{print $2}' "$RUNNER_TEMP/old-checksums.txt" | sed 's/0\.16\.2/0.99.0/g' | sort) <(awk '{print $2}' checksums.txt | sort) && echo SAME CHECKSUM COVERAGE
          echo "--- the windows lookup release.yml does"
          for goarch in amd64 arm64; do
            jq -r --arg a "$goarch" '.[] | select(.type == "Binary" and .goos == "windows" and .goarch == $a) | .path' artifacts.json
          done
      - name: archive contents against v0.16.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/old"
          cd "$RUNNER_TEMP/old"
          gh release download v0.16.2 -R lhns/remote-docker -p '*.tar.gz' -p '*.zip' | tail -1
          for old in *.tar.gz *.zip; do
            new="$GITHUB_WORKSPACE/dist/${old//0.16.2/0.99.0}"
            case "$old" in
              *.zip) l() { unzip -Z1 "$1" | sort; } ;;
              *) l() { tar tzf "$1" | sort; } ;;
            esac
            if diff <(l "$old") <(l "$new") >/dev/null; then echo "SAME CONTENT $old"; else echo "DIFFERENT $old"; diff <(l "$old") <(l "$new"); fi
          done
      - name: main module version matrix, on the built archive
        run: |
          cd dist
          A=$(ls remote-docker_0.99.0_linux_amd64.tar.gz)
          export SYFT_FILE_METADATA_CATALOGER_ENABLED=true
          t() {
            label=$1; shift
            env "$@" syft "$A" -o spdx-json=/tmp/$label.json >/dev/null 2>&1
            printf '%-14s client=%s core=%s\n' "$label" \
              "$(jq -r '.packages[]|select(.name=="github.com/lhns/remote-docker/client")|.versionInfo' /tmp/$label.json)" \
              "$(jq -r '.packages[]|select(.name=="github.com/lhns/remote-docker/core")|.versionInfo' /tmp/$label.json)"
          }
          t default     X=1
          t noldflags   SYFT_GOLANG_MAIN_MODULE_VERSION_FROM_LD_FLAGS=false
          t nocontents  SYFT_GOLANG_MAIN_MODULE_VERSION_FROM_CONTENTS=false
          t none        SYFT_GOLANG_MAIN_MODULE_VERSION_FROM_LD_FLAGS=false SYFT_GOLANG_MAIN_MODULE_VERSION_FROM_CONTENTS=false
          t onlyldflags SYFT_GOLANG_MAIN_MODULE_VERSION_FROM_CONTENTS=false SYFT_GOLANG_MAIN_MODULE_VERSION_FROM_BUILD_SETTINGS=false
          echo "--- version in the SBOMs goreleaser wrote"
          for f in *.sbom.json; do
            printf '%-55s client=%s\n' "$f" "$(jq -r '.packages[]|select(.name=="github.com/lhns/remote-docker/client" or .name=="github.com/lhns/remote-docker/agent")|.versionInfo' "$f")"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: snapshot-new
          path: |
            dist/*.json
            dist/checksums.txt
          retention-days: 3

  vermatrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v1.14.0
      - name: build and scan
        run: |
          set -u
          mkdir -p /tmp/vt/cmd/rd /tmp/vt/internal /tmp/out && cd /tmp/vt
          printf 'module example.com/rd/client\n\ngo 1.22\n' > go.mod
          printf 'package internal\n\nvar Version = "dev"\n' > internal/v.go
          printf 'package main\n\nimport (\n"fmt"\n"example.com/rd/client/internal"\n)\n\nvar version = "dev"\n\nfunc main() { fmt.Println(version, internal.Version) }\n' > cmd/rd/main.go
          I=example.com/rd/client/internal.Version
          n=0
          while IFS='|' read -r label flags; do
            CGO_ENABLED=0 go build -trimpath -o "/tmp/out/$label" -ldflags "$flags" ./cmd/rd
            printf '%-8s ldflags=[%s]\n' "$label" "$flags"
            for v in "" "SYFT_GOLANG_MAIN_MODULE_VERSION_FROM_CONTENTS=false" "SYFT_GOLANG_MAIN_MODULE_VERSION_FROM_CONTENTS=false SYFT_GOLANG_MAIN_MODULE_VERSION_FROM_BUILD_SETTINGS=false"; do
              got=$(env $v syft "/tmp/out/$label" -o json 2>/dev/null | jq -r '.artifacts[]|select(.name=="example.com/rd/client")|.version')
              printf '    %-100s -> %s\n' "${v:-default}" "$got"
            done
          done <<LIST
          a|-s -w -X main.version=0.99.0
          b|-s -w -X main.version=v0.99.0
          c|-s -w -X main.version=0.99.0 -X $I=v5.6.0
          d|-s -w -X $I=v5.6.0 -X main.version=0.99.0
          e|-s -w -X main.version=v0.99.0 -X $I=v5.6.0
          f|-s -w -X main.Version=0.99.0
          g|-s -w -X main.version=0.99.0 -X $I=5.6.0
          h|-s -w -X main.version=0.99.0 -X $I=dev
          LIST
