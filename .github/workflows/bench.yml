name: bench

# A measurement, not a gate: run it when a change claims a mounted directory is
# faster, and paste the table into the record that claims it. The `bench` label
# runs it on a pull request, since workflow_dispatch exists only on main.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      shapes:
        description: "netem shapes, delay:rate, as a JSON list; one job each"
        default: '["0ms:0", "10ms:0", "20ms:0", "80ms:0", "0ms:10mbit"]'
      files:
        description: "files in the tree"
        default: "300"
      modes:
        description: "mount modes to compare"
        default: "read=direct,write=through read=cached,write=through read=cached,write=back read=cached,write=ephemeral"
      prefetch:
        description: "prefetch settings to compare: off, eager, tree"
        default: "off eager tree"
      workloads:
        description: "workloads, from dense subtree sparse dense3 parallel write"
        default: "dense subtree sparse dense3 parallel write"

# Never cancelled: a bench cut off by a push loses the whole measurement.
concurrency:
  group: bench-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mounted-directory:
    name: how fast is a mounted directory at ${{ matrix.shape }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'bench'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # One job per shape, since all would not fit six hours. The rows of a
      # shape share ONE job, which keeps them comparable (ADR 0044).
      matrix:
        shape: ${{ fromJSON(inputs.shapes || '["0ms:0", "10ms:0", "20ms:0", "80ms:0", "0ms:10mbit"]') }}
    # 60 minutes cut a shape off partway.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go

      - name: load the nfs client module
        run: sudo modprobe nfs

      - name: measure
        env:
          BENCH_SHAPES: ${{ matrix.shape }}
          # Empty on a label run, which takes bench.sh's defaults. Only the
          # shapes default is repeated, for the matrix.
          BENCH_FILES: ${{ inputs.files }}
          BENCH_MODES: ${{ inputs.modes }}
          BENCH_PREFETCH: ${{ inputs.prefetch }}
          BENCH_WORKLOADS: ${{ inputs.workloads }}
        run: bash test/bench.sh
