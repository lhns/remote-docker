name: bench

# On request only. This reports numbers rather than passing or failing, and it
# takes minutes: a measurement, not a gate. Run it when a change claims to make
# a mounted directory faster, and paste the table into the record that claims
# it.
#
# Two ways in, because workflow_dispatch only exists for a workflow already on
# the default branch -- which a branch developing the thing being measured is
# not. Labelling the pull request `bench` is how it runs before then, and
# re-labelling is how it runs again.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      shapes:
        description: "netem shapes, delay:rate, as a JSON list; one job each"
        default: '["0ms:0", "10ms:0", "20ms:0", "80ms:0", "0ms:10mbit"]'
      files:
        description: "files in the tree"
        default: "300"
      modes:
        description: "mount modes to compare"
        default: "read=direct,write=through read=cached,write=through read=cached,write=back read=cached,write=ephemeral"
      prefetch:
        description: "prefetch settings to compare: off, eager, tree"
        default: "off eager tree"
      workloads:
        description: "workloads, from dense subtree sparse dense3 parallel write"
        default: "dense subtree sparse dense3 parallel write"

# Never cancelled by a newer run, and each run is its own group: a bench cut
# off by a push loses the whole measurement.
concurrency:
  group: bench-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mounted-directory:
    name: how fast is a mounted directory at ${{ matrix.shape }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'bench'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # One job per shape, in parallel, since all shapes in one job would not
      # fit its six hours. The rows of one shape are still measured in ONE
      # job, which is what makes a policy comparable with another (ADR 0044).
      matrix:
        shape: ${{ fromJSON(inputs.shapes || '["0ms:0", "10ms:0", "20ms:0", "80ms:0", "0ms:10mbit"]') }}
    # Two hours for a shape; 60 minutes was cut off partway and reported as
    # "cancelled".
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache: true
          # THE REPO ROOT IS NOT A MODULE (ADR 0021), and setup-go's default
          # cache key looks for a go.mod there. Without this it reports
          # "Dependencies file is not found" and restores nothing, so every job
          # in every workflow re-downloads the whole graph: 250 modules in `test`
          # alone, measured 2026-09-01. It also made two jobs fail outright that
          # day, when proxy.golang.org was returning stream errors for downloads
          # a cache hit would never have made.
          cache-dependency-path: |
            core/go.sum
            core-agent/go.sum
            core-client/go.sum
            agent/go.sum
            client/go.sum
            test/probes/go.sum

      - name: load the nfs client module
        run: sudo modprobe nfs

      - name: measure
        env:
          BENCH_SHAPES: ${{ matrix.shape }}
          BENCH_FILES: ${{ inputs.files || '300' }}
          # Empty on a label run, which falls through to bench.sh's defaults.
          BENCH_MODES: ${{ inputs.modes }}
          BENCH_PREFETCH: ${{ inputs.prefetch }}
          BENCH_WORKLOADS: ${{ inputs.workloads }}
        run: bash test/bench.sh

      - name: workspace logs
        if: always()
        run: docker logs remote-docker-bench 2>&1 | tail -100 || true
