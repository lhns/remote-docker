name: bench

# On request only. This reports numbers rather than passing or failing, and it
# takes minutes: a measurement, not a gate. Run it when a change claims to make
# a mounted directory faster, and paste the table into the record that claims
# it.
#
# Two ways in, because workflow_dispatch only exists for a workflow already on
# the default branch -- which a branch developing the thing being measured is
# not. Labelling the pull request `bench` is how it runs before then, and
# re-labelling is how it runs again.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      shapes:
        description: "netem shapes, delay:rate, space separated"
        default: "0ms:0 20ms:0 80ms:0 0ms:10mbit"
      files:
        description: "files in the tree"
        default: "300"

permissions:
  contents: read

jobs:
  mounted-directory:
    name: how fast is a mounted directory
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'bench'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache: true

      - name: load the nfs client module
        run: sudo modprobe nfs

      - name: measure
        env:
          BENCH_SHAPES: ${{ inputs.shapes || '0ms:0 20ms:0 80ms:0 0ms:10mbit' }}
          BENCH_FILES: ${{ inputs.files || '300' }}
        run: bash test/bench.sh

      - name: workspace logs on failure
        if: failure()
        run: docker logs remote-docker-bench 2>&1 | tail -100 || true
