name: build and release

# Named for what it does rather than for its rarest job. Every push to main
# comes through here: it runs the whole of ci.yml first, then publishes. Only
# the GitHub Release part is tag-only.
#
# Two things ship from here, on different schedules:
#
#   the workspace image   every push to main as sha-<short>, and on a v* tag
#                         as <version> and latest
#   the client binaries   tags only -- a GitHub Release per commit would be
#                         noise, and the image is what a workspace deploys
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  # cosign signs keyless, with a short-lived certificate bound to this
  # workflow's identity, so there is no key to hold or rotate.
  id-token: write

# Deliberately not cancel-in-progress: a superseded publish should still
# finish, because the tag it was pushing is the only thing that will ever
# carry that commit.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Nothing is published until this passes. It is the whole of ci.yml -- tests,
  # lint, the cross-compile matrix, shellcheck -- run at this exact ref.
  #
  # Without it a tag published from code no workflow had ever checked: ci.yml
  # has no tag trigger, so `git push --tags` went straight to a GitHub Release
  # and to :latest.
  ci:
    uses: ./.github/workflows/ci.yml

  # The version every job below agrees on, computed once.
  meta:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      chart_version: ${{ steps.v.outputs.chart_version }}
      tags: ${{ steps.v.outputs.image_tags }}
      image: ${{ steps.v.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - name: Compute versions
        id: v
        run: |
          OWNER="${{ github.repository_owner }}"
          IMG="ghcr.io/${OWNER}/remote-docker-workspace"
          echo "image=${IMG}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
            echo "image_tags=${IMG}:${V},${IMG}:latest" >> "$GITHUB_OUTPUT"
            echo "version=${V}" >> "$GITHUB_OUTPUT"
            echo "chart_version=${V}" >> "$GITHUB_OUTPUT"
          else
            SHORT="$(git rev-parse --short HEAD)"
            echo "image_tags=${IMG}:sha-${SHORT}" >> "$GITHUB_OUTPUT"
            echo "version=sha-${SHORT}" >> "$GITHUB_OUTPUT"
            # A chart version has to be SemVer, which an image tag does not:
            # `helm package --version sha-735a07c` fails outright. So a commit
            # build gets a prerelease version, which also sorts below every
            # release, so `helm install` without --version never picks one up.
            echo "chart_version=0.0.0-dev.${SHORT}" >> "$GITHUB_OUTPUT"
          fi

  # One job per architecture, each on a runner of that architecture.
  #
  # This used to be a single job building both under QEMU, and emulating arm64
  # to compile Go and run apk cost more than everything else in the workflow
  # put together -- 5m25s against 1m40s for the whole test suite. Native arm
  # runners are free for public repositories, so the emulation was buying
  # nothing.
  #
  # Each pushes by digest only; the manifest job below joins them under the
  # real tags. That is docker's own recommended shape for this, and it is what
  # lets the two architectures build at the same time instead of one after the
  # other.
  image:
    name: image (${{ matrix.platform }})
    needs: [ci, meta]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          # Context is the repository root, not image/: the agent is compiled
          # from source here.
          context: .
          file: image/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
          outputs: type=image,name=${{ needs.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          # Scoped per architecture: one cache shared between them would have
          # each build evicting the other's layers on every run.
          cache-from: type=gha,scope=image-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.platform }}

      - name: Export the digest
        run: |
          mkdir -p /tmp/digests
          # The sha256: prefix has to come off: an artifact filename may not
          # contain a colon, and upload-artifact refuses the whole upload.
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Joins the per-architecture digests into one multi-arch tag. Cheap: it moves
  # no layers, only writes a manifest list.
  manifest:
    name: workspace image
    needs: [image, meta]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the manifest list
        run: |
          set -eux
          TAGS=""
          for tag in $(echo "${{ needs.meta.outputs.tags }}" | tr ',' ' '); do
            TAGS="$TAGS -t $tag"
          done
          # shellcheck disable=SC2086
          docker buildx imagetools create $TAGS             $(printf "${{ needs.meta.outputs.image }}@sha256:%s " *)
        working-directory: /tmp/digests

      - name: Show what was published
        run: docker buildx imagetools inspect "$(echo '${{ needs.meta.outputs.tags }}' | cut -d, -f1)"

      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1
      - uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v1.14.0

      # The manifest list, by digest. Signing a tag would sign a name that can
      # be moved; signing the per-platform digests would leave what `docker
      # pull` actually resolves unsigned.
      - name: Sign the image and attest its contents
        env:
          COSIGN_YES: "true"
        run: |
          set -eux
          TAG=$(echo '${{ needs.meta.outputs.tags }}' | cut -d, -f1)
          DIGEST=$(docker buildx imagetools inspect "$TAG" --format '{{.Manifest.Digest}}')
          REF="${{ needs.meta.outputs.image }}@${DIGEST}"

          cosign sign "$REF"
          syft "$REF" -o spdx-json=workspace-image.sbom.spdx.json
          cosign attest --predicate workspace-image.sbom.spdx.json --type spdx "$REF"

  # The chart is published to the same registry as the image and signed the same
  # way, so `helm install oci://...` and `cosign verify` are one habit rather
  # than two.
  chart:
    name: helm chart
    needs: [ci, meta]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # cosign pushes the signature to ghcr itself, and reads the docker
      # credential store to do it. `helm registry login` below writes helm's
      # own file, so without this the chart pushes and then fails to sign with
      # UNAUTHORIZED on a registry it had just written to.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.3
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1
      - uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v1.14.0

      - name: Package and push
        id: push
        env:
          # The app version is the image tag this chart installs by default,
          # so the two travel together and a dev chart installs its own commit.
          VERSION: ${{ needs.meta.outputs.version }}
          CHART_VERSION: ${{ needs.meta.outputs.chart_version }}
        run: |
          set -eux
          helm package charts/remote-docker-workspace \
            --version "$CHART_VERSION" --app-version "$VERSION" --destination .

          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin
          helm push "remote-docker-workspace-${CHART_VERSION}.tgz" \
            oci://ghcr.io/lhns/charts 2>&1 | tee push.log

          echo "digest=$(grep -E '^Digest: ' push.log | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "chart_version=$CHART_VERSION" >> "$GITHUB_OUTPUT"

      - name: Sign the chart and attest its contents
        env:
          COSIGN_YES: "true"
        run: |
          set -eux
          REF="ghcr.io/lhns/charts/remote-docker-workspace@${{ steps.push.outputs.digest }}"
          cosign sign "$REF"
          # syft cannot read a Helm chart in a registry (it does not know the
          # layer media type), so it reads the tarball helm packaged, which is
          # byte for byte what was pushed.
          syft "remote-docker-workspace-${{ steps.push.outputs.chart_version }}.tgz" \
            -o spdx-json=workspace-chart.sbom.spdx.json
          cosign attest --predicate workspace-chart.sbom.spdx.json --type spdx "$REF"

      - name: Attach the chart to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            remote-docker-workspace-*.tgz
            workspace-chart.sbom.spdx.json

  # Skipped on ordinary commits, and that is deliberate: this job publishes a
  # GitHub Release, which per-commit would be noise, and `goreleaser release`
  # needs a tag to release. Per-commit binaries are not missing -- the ci
  # job above builds them from this same .goreleaser.yaml and uploads them as
  # workflow artifacts.
  binaries:
    name: release binaries (tags only)
    needs: [ci]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@v7
        with:
          # goreleaser builds the changelog from history, which a shallow
          # clone does not have.
          fetch-depth: 0

      # Keyed on the five modules because the root is not one. See ci.yml.
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache: true
          cache-dependency-path: |
            core/go.sum
            core-agent/go.sum
            core-client/go.sum
            agent/go.sum
            client/go.sum

      # What the embedded Compose reports as its version. Read from the module
      # graph so it cannot drift from go.mod.
      - name: compose version
        run: echo "COMPOSE_VERSION=$(cd client && go list -m -f '{{.Version}}' github.com/docker/compose/v5)" >> "$GITHUB_ENV"

      # goreleaser's sboms block shells out to syft, so it has to be here as
      # well as in the image and chart jobs. Same pin as those.
      - uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v1.14.0

      # The release description is the CHANGELOG's section for this version,
      # not a list of commits. goreleaser generates the list by default, which
      # is the git history rewritten slightly -- useful, and not what somebody
      # arriving at a release page wants to read first.
      #
      # Falls back to the generated notes when the changelog has no section for
      # the tag, so a release is never blocked by a missing entry, and says so
      # in the log rather than silently publishing a commit dump.
      - id: notes
        name: release notes from the changelog
        run: |
          set -u
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
              $0 ~ "^## " v {found = 1; next}
              /^## / {if (found) exit}
              found {print}
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"

          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            echo "flag=--release-notes=$RUNNER_TEMP/notes.md" >>"$GITHUB_OUTPUT"
            echo "using the CHANGELOG section for $version:"
            head -5 "$RUNNER_TEMP/notes.md"
          else
            echo "flag=" >>"$GITHUB_OUTPUT"
            echo "WARNING: CHANGELOG.md has no '## $version' section; falling back to generated notes."
          fi

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean ${{ steps.notes.outputs.flag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

