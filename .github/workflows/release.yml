name: release

# Two things ship from here, on different schedules:
#
#   the workspace image   every push to main as sha-<short>, and on a v* tag
#                         as <version> and latest
#   the client binaries   tags only -- a GitHub Release per commit would be
#                         noise, and the image is what a workspace deploys
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

# Deliberately not cancel-in-progress: a superseded publish should still
# finish, because the tag it was pushing is the only thing that will ever
# carry that commit.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: workspace image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute versions
        id: v
        run: |
          OWNER="${{ github.repository_owner }}"
          IMG="ghcr.io/${OWNER}/remote-docker-workspace"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
            echo "image_tags=${IMG}:${V},${IMG}:latest" >> "$GITHUB_OUTPUT"
            echo "version=${V}" >> "$GITHUB_OUTPUT"
          else
            SHA="sha-$(git rev-parse --short HEAD)"
            echo "image_tags=${IMG}:${SHA}" >> "$GITHUB_OUTPUT"
            echo "version=${SHA}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          # Context is the repository root, not image/: the agent is compiled
          # from source here.
          context: .
          file: image/Dockerfile
          # The workspace runs Docker-in-Docker on whatever the deployment
          # host is, so both architectures are worth publishing.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.v.outputs.image_tags }}
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binaries:
    name: client binaries
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@v4
        with:
          # goreleaser builds the changelog from history, which a shallow
          # clone does not have.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
