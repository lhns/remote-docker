name: build and release

# Every push to main runs ci.yml, then publishes. Two schedules:
#
#   the workspace image   every push to main as sha-<short>, and on a v* tag
#                         as <version> and latest
#   the client binaries   tags only -- a GitHub Release per commit would be
#                         noise, and the image is what a workspace deploys
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  # cosign signs keyless, so there is no key to hold.
  id-token: write

# A superseded publish still finishes: its tag is the only one for that commit.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Nothing is published until all of ci.yml passes at this ref; ci.yml has no
  # tag trigger of its own.
  ci:
    uses: ./.github/workflows/ci.yml

  # The version every job below agrees on, computed once.
  meta:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      chart_version: ${{ steps.v.outputs.chart_version }}
      tags: ${{ steps.v.outputs.image_tags }}
      image: ${{ steps.v.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - name: Compute versions
        id: v
        run: |
          OWNER="${{ github.repository_owner }}"
          IMG="ghcr.io/${OWNER}/remote-docker-workspace"
          echo "image=${IMG}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
            echo "image_tags=${IMG}:${V},${IMG}:latest" >> "$GITHUB_OUTPUT"
            echo "version=${V}" >> "$GITHUB_OUTPUT"
            echo "chart_version=${V}" >> "$GITHUB_OUTPUT"
          else
            SHORT="$(git rev-parse --short HEAD)"
            echo "image_tags=${IMG}:sha-${SHORT}" >> "$GITHUB_OUTPUT"
            echo "version=sha-${SHORT}" >> "$GITHUB_OUTPUT"
            # A chart version must be SemVer. A prerelease also sorts below
            # every release, so `helm install` never picks one up by default.
            echo "chart_version=0.0.0-dev.${SHORT}" >> "$GITHUB_OUTPUT"
          fi

  # One native runner per architecture: QEMU cost 5m25s against 1m40s for all
  # the tests. Each pushes by digest; `manifest` joins them under the tags.
  image:
    name: image (${{ matrix.platform }})
    needs: [ci, meta]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          # The repository root: the agent is compiled from source.
          context: .
          file: image/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
          outputs: type=image,name=${{ needs.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          # Per architecture, or each build evicts the other's layers.
          cache-from: type=gha,scope=image-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.platform }}

      - name: Export the digest
        run: |
          mkdir -p /tmp/digests
          # No colon in an artifact filename.
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # The per-architecture digests under one multi-arch tag.
  manifest:
    name: workspace image
    needs: [image, meta]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the manifest list
        run: |
          set -eux
          TAGS=""
          for tag in $(echo "${{ needs.meta.outputs.tags }}" | tr ',' ' '); do
            TAGS="$TAGS -t $tag"
          done
          # shellcheck disable=SC2086
          docker buildx imagetools create $TAGS \
            $(printf "${{ needs.meta.outputs.image }}@sha256:%s " *)
        working-directory: /tmp/digests

      - name: Show what was published
        run: docker buildx imagetools inspect "$(echo '${{ needs.meta.outputs.tags }}' | cut -d, -f1)"

      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1
      - uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v1.14.0

      # The manifest list by digest: a tag can move, and per-platform digests
      # leave what `docker pull` resolves unsigned.
      - name: Sign the image and attest its contents
        env:
          COSIGN_YES: "true"
        run: |
          set -eux
          TAG=$(echo '${{ needs.meta.outputs.tags }}' | cut -d, -f1)
          DIGEST=$(docker buildx imagetools inspect "$TAG" --format '{{.Manifest.Digest}}')
          REF="${{ needs.meta.outputs.image }}@${DIGEST}"

          cosign sign "$REF"
          syft "$REF" -o spdx-json=workspace-image.sbom.spdx.json
          cosign attest --predicate workspace-image.sbom.spdx.json --type spdx "$REF"

  # The chart, in the same registry as the image and signed the same way.
  chart:
    name: helm chart
    needs: [ci, meta]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # cosign reads the docker credential store, not helm's: without this the
      # chart pushes and then fails to sign with UNAUTHORIZED.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.3
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1
      - uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v1.14.0

      - name: Package and push
        id: push
        env:
          # The app version is the image tag the chart installs by default.
          VERSION: ${{ needs.meta.outputs.version }}
          CHART_VERSION: ${{ needs.meta.outputs.chart_version }}
        run: |
          set -euxo pipefail
          helm package charts/remote-docker-workspace \
            --version "$CHART_VERSION" --app-version "$VERSION" --destination .

          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin
          helm push "remote-docker-workspace-${CHART_VERSION}.tgz" \
            oci://ghcr.io/lhns/charts 2>&1 | tee push.log

          echo "digest=$(grep -E '^Digest: ' push.log | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "chart_version=$CHART_VERSION" >> "$GITHUB_OUTPUT"

      - name: Sign the chart and attest its contents
        env:
          COSIGN_YES: "true"
        run: |
          set -eux
          REF="ghcr.io/lhns/charts/remote-docker-workspace@${{ steps.push.outputs.digest }}"
          cosign sign "$REF"
          # syft cannot read a chart in a registry, so it reads the pushed tarball.
          syft "remote-docker-workspace-${{ steps.push.outputs.chart_version }}.tgz" \
            -o spdx-json=workspace-chart.sbom.spdx.json
          cosign attest --predicate workspace-chart.sbom.spdx.json --type spdx "$REF"

      - name: Attach the chart to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            remote-docker-workspace-*.tgz
            workspace-chart.sbom.spdx.json

  # Tags only. Per-commit binaries are ci.yml's artifacts, from the same
  # .goreleaser.yaml.
  binaries:
    name: release binaries (tags only)
    needs: [ci]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@v7
        with:
          # goreleaser reads history, which a shallow clone lacks.
          fetch-depth: 0

      - uses: ./.github/actions/setup-go

      # What the embedded Compose reports, read from the module graph.
      - name: compose version
        run: echo "COMPOSE_VERSION=$(cd client && go list -m -f '{{.Version}}' github.com/docker/compose/v5)" >> "$GITHUB_ENV"

      # goreleaser's sboms block shells out to syft.
      - uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v1.14.0

      # The release body is the CHANGELOG's section for the tag, falling back
      # to goreleaser's commit list with a warning rather than blocking.
      - id: notes
        name: release notes from the changelog
        run: |
          set -u
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
              $0 ~ "^## " v {found = 1; next}
              /^## / {if (found) exit}
              found {print}
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"

          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            echo "flag=--release-notes=$RUNNER_TEMP/notes.md" >>"$GITHUB_OUTPUT"
            echo "using the CHANGELOG section for $version:"
            head -5 "$RUNNER_TEMP/notes.md"
          else
            echo "flag=" >>"$GITHUB_OUTPUT"
            echo "WARNING: CHANGELOG.md has no '## $version' section; falling back to generated notes."
          fi

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean ${{ steps.notes.outputs.flag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The two Windows binaries for `installers`, located through
      # artifacts.json: goreleaser's directory names carry variant suffixes.
      - name: collect the windows binaries
        run: |
          set -eux
          for goarch in amd64 arm64; do
            binary=$(jq -r --arg a "$goarch" \
              '.[] | select(.type == "Binary" and .goos == "windows" and .goarch == $a) | .path' \
              dist/artifacts.json)
            if [ -z "$binary" ]; then
              echo "no windows/$goarch binary in dist/artifacts.json" >&2
              exit 1
            fi
            mkdir -p "windows/$goarch"
            cp "$binary" "windows/$goarch/remote-docker.exe"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: windows-binaries
          path: windows/**/remote-docker.exe
          if-no-files-found: error
          retention-days: 1

  # The MSIs, attached to the release above. A Windows job and a gh upload,
  # not goreleaser (ADR 0048). Named to sit beside the zips; not in
  # checksums.txt, which goreleaser wrote first.
  installers:
    name: windows installers (tags only)
    needs: [binaries]
    runs-on: windows-latest
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: windows-binaries
          path: windows
      - uses: ./.github/actions/setup-wix

      - name: build them and attach them to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          foreach ($pair in @(@('amd64', 'x64'), @('arm64', 'arm64'))) {
            ./installer/windows/build.ps1 -Version $version -Arch $pair[1] `
              -Binary "windows/$($pair[0])/remote-docker.exe" `
              -Out "dist/msi/remote-docker_${version}_windows_$($pair[0]).msi"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          # An array expands to one argument per element for a native command.
          $msis = @(Get-ChildItem dist/msi/*.msi | ForEach-Object { $_.FullName })
          gh release upload $env:GITHUB_REF_NAME $msis --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }
