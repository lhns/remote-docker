name: build and release

# Named for what it does rather than for its rarest job. Every push to main
# comes through here: it runs the whole of ci.yml first, then publishes. Only
# the GitHub Release part is tag-only.
#
# Two things ship from here, on different schedules:
#
#   the workspace image   every push to main as sha-<short>, and on a v* tag
#                         as <version> and latest
#   the client binaries   tags only -- a GitHub Release per commit would be
#                         noise, and the image is what a workspace deploys
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

# Deliberately not cancel-in-progress: a superseded publish should still
# finish, because the tag it was pushing is the only thing that will ever
# carry that commit.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Nothing is published until this passes. It is the whole of ci.yml -- tests,
  # lint, the cross-compile matrix, shellcheck -- run at this exact ref.
  #
  # Without it a tag published from code no workflow had ever checked: ci.yml
  # has no tag trigger, so `git push --tags` went straight to a GitHub Release
  # and to :latest.
  ci:
    uses: ./.github/workflows/ci.yml

  # The version every job below agrees on, computed once.
  meta:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tags: ${{ steps.v.outputs.image_tags }}
      image: ${{ steps.v.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - name: Compute versions
        id: v
        run: |
          OWNER="${{ github.repository_owner }}"
          IMG="ghcr.io/${OWNER}/remote-docker-workspace"
          echo "image=${IMG}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
            echo "image_tags=${IMG}:${V},${IMG}:latest" >> "$GITHUB_OUTPUT"
            echo "version=${V}" >> "$GITHUB_OUTPUT"
          else
            SHA="sha-$(git rev-parse --short HEAD)"
            echo "image_tags=${IMG}:${SHA}" >> "$GITHUB_OUTPUT"
            echo "version=${SHA}" >> "$GITHUB_OUTPUT"
          fi

  # One job per architecture, each on a runner of that architecture.
  #
  # This used to be a single job building both under QEMU, and emulating arm64
  # to compile Go and run apk cost more than everything else in the workflow
  # put together -- 5m25s against 1m40s for the whole test suite. Native arm
  # runners are free for public repositories, so the emulation was buying
  # nothing.
  #
  # Each pushes by digest only; the manifest job below joins them under the
  # real tags. That is docker's own recommended shape for this, and it is what
  # lets the two architectures build at the same time instead of one after the
  # other.
  image:
    name: image (${{ matrix.platform }})
    needs: [ci, meta]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          # Context is the repository root, not image/: the agent is compiled
          # from source here.
          context: .
          file: image/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
          outputs: type=image,name=${{ needs.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          # Scoped per architecture: one cache shared between them would have
          # each build evicting the other's layers on every run.
          cache-from: type=gha,scope=image-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.platform }}

      - name: Export the digest
        run: |
          mkdir -p /tmp/digests
          # The sha256: prefix has to come off: an artifact filename may not
          # contain a colon, and upload-artifact refuses the whole upload.
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Joins the per-architecture digests into one multi-arch tag. Cheap: it moves
  # no layers, only writes a manifest list.
  manifest:
    name: workspace image
    needs: [image, meta]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the manifest list
        run: |
          set -eux
          TAGS=""
          for tag in $(echo "${{ needs.meta.outputs.tags }}" | tr ',' ' '); do
            TAGS="$TAGS -t $tag"
          done
          # shellcheck disable=SC2086
          docker buildx imagetools create $TAGS             $(printf "${{ needs.meta.outputs.image }}@sha256:%s " *)
        working-directory: /tmp/digests

      - name: Show what was published
        run: docker buildx imagetools inspect "$(echo '${{ needs.meta.outputs.tags }}' | cut -d, -f1)"

  # Skipped on ordinary commits, and that is deliberate: this job publishes a
  # GitHub Release, which per-commit would be noise, and `goreleaser release`
  # needs a tag to release. Per-commit binaries are not missing -- the ci
  # job above builds them from this same .goreleaser.yaml and uploads them as
  # workflow artifacts.
  binaries:
    name: release binaries (tags only)
    needs: [ci]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@v7
        with:
          # goreleaser builds the changelog from history, which a shallow
          # clone does not have.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
