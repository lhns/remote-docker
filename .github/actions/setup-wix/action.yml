name: setup wix
description: >-
  WiX v5 as a dotnet global tool, with the UI extension the installer uses.

# WINDOWS RUNNERS ONLY. WiX loads anywhere .NET does and works only on Windows,
# which is why both callers of this action are Windows jobs (ADR 0048).
#
# Pinned, and pinned in one place: the extension version has to match the
# toolset version, and two workflows naming them separately would drift the
# first time one was bumped.
inputs:
  version:
    description: WiX toolset version
    required: false
    default: "5.0.2"

runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: "8.0.x"

    # pwsh, so the tools directory is a native path; Git Bash would hand
    # `wix.exe` an MSYS path and hope.
    - shell: pwsh
      run: |
        dotnet tool install --global wix --version "${{ inputs.version }}"
        if ($LASTEXITCODE -ne 0) { exit 1 }
        # GITHUB_PATH takes effect from the next step, so this one adds the
        # directory to its own PATH as well to reach `wix` below.
        $tools = Join-Path $HOME '.dotnet/tools'
        Add-Content -Path $env:GITHUB_PATH -Value $tools
        $env:PATH = $env:PATH + [IO.Path]::PathSeparator + $tools
        wix extension add -g "WixToolset.UI.wixext/${{ inputs.version }}"
        if ($LASTEXITCODE -ne 0) { exit 1 }
        wix --version
