# Tier "restricted-localhost": `restricted` level with a Localhost seccomp profile
# that allows everything (userns.json), which restricted admits. no_new_privs and
# dropped capabilities stay.
apiVersion: v1
kind: Pod
metadata:
  name: __NAME__
  namespace: __NS__
  labels:
    app: unprivileged-probe
spec:
  #__HOSTUSERS__
  restartPolicy: Never
  containers:
    - name: probe
      image: unprivileged-probe:kind
      imagePullPolicy: Never
      command: ["bash", "/usr/local/bin/unprivileged-probe.sh", "rows"]
      env:
        - {name: PROBE_TIER, value: __NAME__}
        - {name: PROBE_WORK, value: /work}
        - {name: HOME, value: /work/home}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        allowPrivilegeEscalation: false
        capabilities: {drop: ["ALL"]}
        seccompProfile: {type: Localhost, localhostProfile: userns.json}
      volumeMounts:
        - {name: work, mountPath: /work}
  volumes:
    - name: work
      emptyDir: {}
