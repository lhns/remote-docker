# Default values for remote-docker-workspace.

# Override the generated resource names. nameOverride replaces the chart name
# in `<release>-<name>`; fullnameOverride replaces the whole base name.
nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/lhns/remote-docker-workspace
  # tag overrides Chart.appVersion when set.
  tag: ""
  pullPolicy: IfNotPresent
  # pullSecrets is a list of references to secrets in the release namespace.
  pullSecrets: []

# How many workspaces to run. Each replica is a workspace of its own: its own
# state volume (host key, uids, tokens, enrolled keys), graph volume, accounts'
# daemons and ephemeral runs. Only the keys Secret is shared, so an account
# enrolled there exists on every replica, and nothing else crosses between them.
#
# A client must stay on one replica for its whole life. The Service below pins
# each client address to a replica (sessionAffinity: ClientIP); the headless
# Service gives every pod a stable name, <fullname>-N.<fullname>-headless.<ns>.svc,
# for a client that wants to choose. An ingress does NOT honour the Service's
# affinity: see ingress.annotations. Chart README, "Several replicas".
replicas: 1

# Keep replicas off each other's node, matched on kubernetes.io/hostname:
#
#   hard   one replica per node; a replica with no free node stays Pending
#   soft   prefer spreading, but allow two on one node
#   none   leave it to the scheduler, whose default spreading allows two or
#          three on one node
#
# Ignored when `affinity` is set: that is then the whole answer.
podAntiAffinity: hard

# Public keys of the machines allowed in, one entry per account. Optional: a
# device can enrol its own key with a token instead (NOTES.txt). The KEY of
# each entry is the account name a client logs in as (the unix user behind it
# is rd-<name>, ADR 0025), and its value is one or more SSH public keys, one
# per line:
#
#   authorizedKeys:
#     alice: |
#       ssh-ed25519 AAAA... alice@laptop
#       ssh-ed25519 AAAA... alice@desktop
#     bob: |
#       ssh-ed25519 AAAA... bob@laptop
#
# The workspace re-reads the directory within a minute, so a new account is not
# enrolled the instant you upgrade. Emptying an entry revokes that account and
# keeps its home directory.
authorizedKeys: {}

# The address devices reach this workspace at, written into every enrolment
# token's invite (WORKSPACE_PUBLIC_URL). Empty derives it from the ingress:
# wss://<ingress.host>/ with TLS, ws:// without. Set it when something other
# than this chart's ingress fronts the workspace.
#
# With replicas > 1, empty is instead each pod's own name,
# ssh://<pod>.<fullname>-headless.<ns>.svc:2222, because a token is redeemable
# only on the replica that minted it and neither the ingress nor the Service
# can name one. That address is reachable only inside the cluster. A value here
# is used by every replica as it stands.
publicURL: ""

# Accounts that manage every account from their own machine (ADR 0053,
# WORKSPACE_ADMINS): tokens for anybody, `remote user rm`, and other accounts'
# keys. Every other account manages only its own tokens and keys. A name here
# need not be enrolled yet; the first admin enrols with a token from
# `remote-dockerd token create --account <name>`.
admins: []

# false lets only admins create tokens through `remote` (WORKSPACE_USER_TOKENS).
userTokens: true

# Use a Secret you manage instead -- sealed-secrets, an external secrets
# operator, or one you created by hand. Its keys are filenames and must be
# account names. Set this and `authorizedKeys` is ignored.
existingSecret: ""

# A dockerd per account (the default), or one shared between them.
#
#   true   each account gets its own daemon, so nobody sees anybody else's
#          containers or images by accident (ADR 0019)
#   false  one daemon for everybody (ADR 0012)
#
# Per-account is separation, not isolation: each daemon is privileged, so a
# determined account can still break out and reach another's.
perUserDind: true

# Arguments passed to the workspace's own dockerd.
#
# fuse-overlayfs by default because overlay2 REFUSES TO START on Ceph- and
# NFS-backed volumes, which is what most default StorageClasses hand out, and
# the failure is a daemon that never comes up rather than a warning. Set this
# to "" on a cluster with local volumes: overlay2 is faster, and it is the
# right choice when the storage allows it.
dockerdArgs: "--storage-driver=fuse-overlayfs"

# The image each account's own daemon runs, when perUserDind is on. Empty means
# this chart's own image.
#
# It has to be one that carries the storage driver above, and stock docker:dind
# does not carry fuse-overlayfs: a daemon started from it dies in a restart
# loop. Compose and Swarm find the right image by inspecting the container they
# run in; nothing in a pod can, so the chart passes it.
dindImage: ""

# Accounts whose clients are ephemeral (ADR 0050), for autoscaled CI runners
# sharing one key: every client process gets its own port, export and volumes,
# removed `grace` after its last connection. Each account needs a key in
# `authorizedKeys`, or in `existingSecret`. Nothing is set while `accounts` is
# empty, and an `env` entry for the same variable wins.
ephemeral:
  accounts: []
  # Runs per account, connected or in grace; the next is refused.
  maxClients: 8
  # How long a run keeps its port and volumes after its last connection, for a
  # reconnect. A Go duration, such as 90s or 2m.
  grace: 2m
  # Also remove an expired run's containers and compose networks. Off, a run
  # whose containers remain keeps its slot until somebody removes them.
  cleanupContainers: false

# Prometheus metrics (ADR 0054): GET /metrics in plain HTTP on a port of its
# own (WORKSPACE_METRICS_ADDR), never the SSH or WebSocket one. Enabled, the pod
# carries the prometheus.io/scrape, /port and /path annotations. No
# ServiceMonitor, which would need the operator's CRD. Change the port here,
# not with an `env` entry: the annotations follow `port`. The port has no
# authentication and listens on every interface: admit only the scraper with a
# NetworkPolicy.
metrics:
  enabled: false
  port: 9090

# Extra environment for the agent, e.g. TZ or WORKSPACE_UID_BASE.
env: {}

persistence:
  # The workspace's own image store: images somebody pulled, and the containers
  # they run.
  #
  # ReadWriteOnce is a CORRECTNESS requirement here, not a default worth
  # relaxing. Two dockerds must never share a graph directory; doing it
  # corrupts the store rather than racing politely. Even on storage that offers
  # ReadWriteMany, this stays RWO.
  graph:
    # A claim you created yourself, mounted by name instead of generated from
    # the template below. Empty keeps the template.
    #
    # Worth it because a StatefulSet's volumeClaimTemplates are IMMUTABLE, so
    # `size` here only applies to a claim that does not exist yet. A claim you
    # own is an ordinary PVC whose size you can edit, given a StorageClass with
    # allowVolumeExpansion.
    #
    # `size`, `storageClass` and `accessModes` are then ignored: they describe a
    # claim this chart no longer makes.
    existingClaim: ""
    size: 50Gi
    # "" uses the cluster's default StorageClass; "-" disables dynamic
    # provisioning.
    storageClass: ""
    accessModes:
      - ReadWriteOnce

  # Host keys, the uid map, the per-machine port record, the keys enrolled
  # with a token and the unredeemed tokens.
  #
  # Losing this is not losing a cache. The SSH host keys change, so every
  # client that has connected before gets REMOTE HOST IDENTIFICATION HAS
  # CHANGED; every key enrolled with a token is revoked; and every account's
  # uid moves, which moves its reverse-tunnel port, which strands the volumes
  # named after the old one.
  #
  # RWO because the agent is the only writer. ReadWriteMany is safe here if
  # your storage prefers it, and makes rescheduling onto another node quicker
  # since the volume need not detach first. Each replica has a claim of its
  # own, so it is never shared between them.
  state:
    # As above. These are independent -- supplying one claim and letting the
    # other be generated is fine.
    existingClaim: ""
    size: 1Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce

service:
  type: ClusterIP
  # SSH. Reachable inside the cluster and through `kubectl port-forward`;
  # nothing publishes it. The ingress below is the way in from outside.
  sshPort: 2222
  # The WebSocket the ingress fronts.
  wsPort: 2280
  # How long the Service keeps sending one client address to the same replica
  # after its last connection. 86400 is the most Kubernetes accepts. A client
  # idle for longer may land on another replica, whose host key it refuses.
  sessionAffinityTimeout: 86400
  annotations: {}
  # The headless Service, <fullname>-headless, has no ports of its own to set:
  # a headless name resolves to pod IPs, so its ports are the ones the agent
  # listens on, 2222 and 2280, and its SRV records (_ssh._tcp, _ws._tcp) say so.

# The way in from outside the cluster.
#
# On by default, because a workspace nobody can reach is not a deployment. It
# needs a host: an ingress with none matches every request that arrives at the
# controller, so the chart refuses to render rather than install that.
ingress:
  enabled: true

  # Required when enabled. Devices enrol with a token whose invite names it;
  # NOTES.txt prints the command that mints one.
  host: ""

  className: ""

  # A tunnel is ONE request that lasts as long as the session, so a controller's
  # ordinary read timeout will cut it. These are ingress-nginx's; the equivalent
  # elsewhere:
  #
  #   Traefik   a ServersTransport with forwardingTimeouts.readIdleTimeout,
  #             or the default, which does not time out idle streams
  #   HAProxy   haproxy.org/timeout-server
  #
  # Only ingress-nginx is tested by CI. The others are suggestions.
  #
  # With replicas > 1, ingress-nginx balances across the pods itself and
  # ignores the Service's affinity, so a client reconnecting lands on any
  # replica. Pin each client address to one:
  #
  #   nginx.ingress.kubernetes.io/upstream-hash-by: "$remote_addr"
  #
  # NOTES.txt warns when it is missing.
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"

  tls:
    enabled: true
    # The Secret holding the certificate. cert-manager fills this in when the
    # annotation above names an issuer.
    secretName: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

# The pod is privileged: dockerd sets up its own bridge and iptables rules and
# mounts NFS in its own namespace, none of which an unprivileged container can
# do. On a cluster with Pod Security admission the namespace must allow it:
#
#   kubectl label namespace <ns> pod-security.kubernetes.io/enforce=privileged
#
# There is no unprivileged mode to fall back to.
securityContext:
  privileged: true

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""

# All three probes run `remote-dockerd healthcheck`, which asks the agent and
# the daemon behind it.
probes:
  # Generous: the first start builds a graph directory and starts a daemon.
  startupSeconds: 300
  periodSeconds: 30

commonLabels: {}
commonAnnotations: {}
