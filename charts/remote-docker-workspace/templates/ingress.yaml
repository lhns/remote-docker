{{- if .Values.ingress.enabled }}
{{/*
The way in from outside the cluster: SSH inside a WebSocket, so an ordinary
HTTP ingress carries it and no TCP load balancer is needed (ADR 0034).

The host is required. An ingress with no host matches every request that
arrives at the controller, so this refuses to render rather than install it.
*/}}
{{- $host := required "ingress.host is required when ingress.enabled is true. Set it to the name clients will use, or set ingress.enabled=false and expose the workspace yourself." .Values.ingress.host }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "remote-docker-workspace.fullname" . }}
  labels:
    {{- include "remote-docker-workspace.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $host | quote }}
      {{- with .Values.ingress.tls.secretName }}
      secretName: {{ . }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          {{- /* The agent accepts an upgrade on any path, so this takes the
                whole host and the proxy may rewrite or not. */}}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "remote-docker-workspace.fullname" . }}
                port:
                  name: ws
{{- end }}
