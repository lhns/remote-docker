{{- if not .Values.existingSecret }}
{{/*
One entry per account, and the entry's NAME is the unix account name: the agent
reads the directory and takes each filename as an account. Public keys only,
which is why this is not stringData-with-care -- there is nothing secret in it,
and it is a Secret because that is what mounts as a directory of files.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "remote-docker-workspace.keysSecretName" . }}
  labels:
    {{- include "remote-docker-workspace.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $account, $keys := .Values.authorizedKeys }}
  {{ $account }}.pub: |
    {{- $keys | nindent 4 }}
  {{- end }}
{{- end }}
