apiVersion: v1
kind: Service
metadata:
  name: {{ include "remote-docker-workspace.fullname" . }}
  labels:
    {{- include "remote-docker-workspace.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- /* Each replica is a workspace of its own, so a client must keep
        reaching the one it started on. kube-proxy pins a client address to a
        replica; an ingress balances by itself and ignores this (values.yaml,
        ingress.annotations). */}}
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: {{ .Values.service.sessionAffinityTimeout }}
  selector:
    {{- include "remote-docker-workspace.selectorLabels" . | nindent 4 }}
  ports:
    {{- /* SSH is here so `kubectl port-forward` and anything inside the
          cluster can reach it. Nothing publishes it: the ingress is the way
          in from outside. */}}
    - name: ssh
      port: {{ .Values.service.sshPort }}
      targetPort: ssh
      protocol: TCP
    - name: ws
      port: {{ .Values.service.wsPort }}
      targetPort: ws
      protocol: TCP
