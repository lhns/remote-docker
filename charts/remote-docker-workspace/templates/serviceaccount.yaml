{{- if .Values.serviceAccount.create }}
{{/*
No Role or ClusterRole goes with this. The agent never talks to the Kubernetes
API: it runs a daemon, provisions unix accounts and serves SSH.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "remote-docker-workspace.serviceAccountName" . }}
  labels:
    {{- include "remote-docker-workspace.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
