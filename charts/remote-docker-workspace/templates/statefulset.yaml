{{/*
A StatefulSet rather than a Deployment.

Two pods must never hold the same graph directory, and a rolling Deployment
starts the replacement before the old pod is gone. A StatefulSet terminates
first, and its volume claim templates give each replica volumes of its own,
named after its ordinal, that outlive the pod they were created for. Each
replica is a separate workspace (ADR 0035).
*/}}
{{- include "remote-docker-workspace.checks" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "remote-docker-workspace.fullname" . }}
  labels:
    {{- include "remote-docker-workspace.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicas }}
  serviceName: {{ include "remote-docker-workspace.headlessName" . }}
  selector:
    matchLabels:
      {{- include "remote-docker-workspace.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "remote-docker-workspace.labels" . | nindent 8 }}
      annotations:
        {{- /* Roll the pod when the enrolled keys change. Without this a
              helm upgrade that adds an account waits for the agent's own
              directory poll, which is up to a minute. */}}
        {{- if not .Values.existingSecret }}
        checksum/keys: {{ toYaml .Values.authorizedKeys | sha256sum }}
        {{- end }}
        {{- if .Values.ephemeral.accounts }}
        checksum/ephemeral: {{ toYaml .Values.ephemeral | sha256sum }}
        {{- end }}
        {{- if .Values.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metrics.port | quote }}
        prometheus.io/path: /metrics
        {{- end }}
        {{- with .Values.commonAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "remote-docker-workspace.serviceAccountName" . }}
      {{- /* The agent never calls the Kubernetes API. An enrolled account gets
            a shell in this container as its own uid, and a projected token is
            mounted at mode 0644, so without this it can read the pod's
            ServiceAccount token. */}}
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- /* dockerd stops when it is told to, but the containers it is running
            are somebody's work: give them time to be stopped rather than
            killed with the node's default 30s. */}}
      terminationGracePeriodSeconds: 60
      containers:
        - name: workspace
          image: {{ include "remote-docker-workspace.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: ssh
              containerPort: 2222
            - name: ws
              containerPort: 2280
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            {{- end }}
          env:
            {{- /* Each variable the chart sets is skipped when `env` names it,
                  so the user's entry is the only one rendered: a duplicate
                  name can be refused by server-side apply. */}}
            {{- /* First: $(POD_NAME) below expands only from a variable
                  defined earlier in this list. */}}
            {{- if not (hasKey .Values.env "POD_NAME") }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- end }}
            {{- if not (hasKey .Values.env "DOCKER_TLS_CERTDIR") }}
            - name: DOCKER_TLS_CERTDIR
              value: ""
            {{- end }}
            {{- if not (hasKey .Values.env "WORKSPACE_PER_USER_DIND") }}
            - name: WORKSPACE_PER_USER_DIND
              value: {{ .Values.perUserDind | quote }}
            {{- end }}
            {{- if not (hasKey .Values.env "WORKSPACE_DOCKERD_ARGS") }}
            - name: WORKSPACE_DOCKERD_ARGS
              value: {{ .Values.dockerdArgs | quote }}
            {{- end }}
            {{- if and .Values.perUserDind (not (hasKey .Values.env "WORKSPACE_DIND_IMAGE")) }}
            {{- /* The image an account's own daemon runs. Elsewhere the agent
                  finds it by inspecting the container it is in; in a pod
                  nothing can, and the stock docker:dind lacks the storage
                  driver this workspace inherits to it. */}}
            - name: WORKSPACE_DIND_IMAGE
              value: {{ default (include "remote-docker-workspace.image" .) .Values.dindImage | quote }}
            {{- end }}
            {{- with include "remote-docker-workspace.ephemeralEnv" . | trim }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- if and .Values.admins (not (hasKey .Values.env "WORKSPACE_ADMINS")) }}
            - name: WORKSPACE_ADMINS
              value: {{ join "," .Values.admins | quote }}
            {{- end }}
            {{- if and (not .Values.userTokens) (not (hasKey .Values.env "WORKSPACE_USER_TOKENS")) }}
            - name: WORKSPACE_USER_TOKENS
              value: "false"
            {{- end }}
            {{- if and .Values.metrics.enabled (not (hasKey .Values.env "WORKSPACE_METRICS_ADDR")) }}
            - name: WORKSPACE_METRICS_ADDR
              value: {{ printf ":%v" .Values.metrics.port | quote }}
            {{- end }}
            {{- with and (not (hasKey .Values.env "WORKSPACE_PUBLIC_URL")) (include "remote-docker-workspace.publicURL" .) }}
            - name: WORKSPACE_PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- /* The agent's own healthcheck, which asks the daemon for its
                version as well: `docker info` in a shell returned 0 for a
                daemon that was answering and unusable. */}}
          startupProbe:
            exec:
              command: ["remote-dockerd", "healthcheck"]
            periodSeconds: 10
            failureThreshold: {{ div .Values.probes.startupSeconds 10 }}
          livenessProbe:
            exec:
              command: ["remote-dockerd", "healthcheck"]
            periodSeconds: {{ .Values.probes.periodSeconds }}
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["remote-dockerd", "healthcheck"]
            periodSeconds: {{ .Values.probes.periodSeconds }}
            timeoutSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: state
              mountPath: /etc/workspace
            - name: graph
              mountPath: /var/lib/docker
            {{- /* Over a subdirectory of the state volume, which is where the
                  agent looks. Read-only: the agent writes the keys it
                  enrols to enrolled_keys.d on the state volume, never
                  here (ADR 0052). */}}
            - name: keys
              mountPath: /etc/workspace/authorized_keys.d
              readOnly: true
      volumes:
        - name: keys
          secret:
            secretName: {{ include "remote-docker-workspace.keysSecretName" . }}
            optional: true
        {{- /* Either named here or generated below, never both: a duplicate
              volume name and the pod is refused. */}}
        {{- if .Values.persistence.state.existingClaim }}
        - name: state
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.state.existingClaim }}
        {{- end }}
        {{- if .Values.persistence.graph.existingClaim }}
        - name: graph
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.graph.existingClaim }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- else }}
      {{- with include "remote-docker-workspace.antiAffinity" . }}
      affinity:
        {{- . | nindent 8 }}
      {{- end }}
      {{- end }}
  {{- /* Omitted when both claims are supplied: an empty
        `volumeClaimTemplates:` is a null, and a null is not a list. */}}
  {{- if or (not .Values.persistence.state.existingClaim) (not .Values.persistence.graph.existingClaim) }}
  volumeClaimTemplates:
    {{- if not .Values.persistence.state.existingClaim }}
    - metadata:
        name: state
        labels:
          {{- include "remote-docker-workspace.volumeClaimLabels" . | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.state.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .Values.persistence.state.size }}
        {{- if .Values.persistence.state.storageClass }}
        {{- if (eq "-" .Values.persistence.state.storageClass) }}
        storageClassName: ""
        {{- else }}
        storageClassName: {{ .Values.persistence.state.storageClass }}
        {{- end }}
        {{- end }}
    {{- end }}
    {{- if not .Values.persistence.graph.existingClaim }}
    - metadata:
        name: graph
        labels:
          {{- include "remote-docker-workspace.volumeClaimLabels" . | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.graph.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .Values.persistence.graph.size }}
        {{- if .Values.persistence.graph.storageClass }}
        {{- if (eq "-" .Values.persistence.graph.storageClass) }}
        storageClassName: ""
        {{- else }}
        storageClassName: {{ .Values.persistence.graph.storageClass }}
        {{- end }}
        {{- end }}
    {{- end }}
  {{- end }}
